<style>
:root {
  --bg: #0f0e0d; --panel: #1a1816; --ink: #f4efe8; --muted: #a39c92; --line: rgba(244,239,232,.12);
  --gold: #d8b98a; --gold2: #b8925c; --display: "Bodoni Moda", Didot, Georgia, serif; --body: "Manrope", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); }
button { font: inherit; color: inherit; }
img { display: block; max-width: 100%; }
.app { max-width: 560px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; position: relative; }

/* Barre du haut */
.top { position: fixed; top: 0; left: 0; right: 0; z-index: 20; padding: calc(env(safe-area-inset-top, 0px) + 14px) max(18px, env(safe-area-inset-right, 0px)) 14px max(18px, env(safe-area-inset-left, 0px));
  display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; max-width: 560px; margin: 0 auto;
  background: linear-gradient(180deg, rgba(15,14,13,.85), rgba(15,14,13,0)); }
.logo { font: italic 400 26px/1 var(--display); text-align: center; letter-spacing: .02em; grid-column: 2; }
.logo b { font-style: normal; font-weight: 600; color: var(--gold); }
.back { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: rgba(26,24,22,.6); backdrop-filter: blur(10px); cursor: pointer; font-size: 18px; }
.prog { position: fixed; top: 0; left: 0; height: 2px; background: linear-gradient(90deg, var(--gold2), var(--gold)); z-index: 30; transition: width .5s cubic-bezier(.2,.8,.2,1); }

.screen { padding: calc(env(safe-area-inset-top, 0px) + 84px) max(18px, env(safe-area-inset-right, 0px)) 40px max(18px, env(safe-area-inset-left, 0px)); display: grid; gap: 20px; }
.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(42px, 12vw, 64px); line-height: .98; letter-spacing: -.01em; }
h2 { font-size: clamp(32px, 8.5vw, 42px); line-height: 1.05; }
h1 i, h2 i { color: var(--gold); }
.sub { color: var(--muted); margin: -6px 0 0; max-width: 38ch; }

.cta { display: block; width: 100%; border: 0; border-radius: 99px; padding: 18px 24px; cursor: pointer; font-weight: 800; font-size: 16px; letter-spacing: .02em;
  color: #1a1206; background: linear-gradient(135deg, #f0dcb8, var(--gold) 45%, var(--gold2)); box-shadow: 0 10px 30px rgba(216,185,138,.25); text-align: center; text-decoration: none; transition: transform .2s; }
.cta:active { transform: scale(.98); }
.ghost { display: block; width: 100%; border: 1px solid var(--line); border-radius: 99px; padding: 16px 20px; background: transparent; cursor: pointer; font-weight: 700; text-align: center; text-decoration: none; color: var(--ink); }
button:focus-visible, a:focus-visible, label:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

/* Accueil */
.home { position: relative; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
.slides { position: absolute; inset: 0; }
.slides img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.6s ease; transform: scale(1.12); }
.slides img.on { opacity: 1; animation: kb 7s ease-out forwards; }
@keyframes kb { from { transform: scale(1.12); } to { transform: scale(1); } }
.home::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15,14,13,.15) 0%, rgba(15,14,13,.1) 35%, rgba(15,14,13,.85) 68%, var(--bg) 100%); }
.home .in { position: relative; z-index: 2; padding: 0 max(22px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 34px) max(22px, env(safe-area-inset-left, 0px)); display: grid; gap: 18px; }
.home .sub { color: #d9d1c6; }
.dots { display: flex; gap: 6px; }
.dots i { width: 18px; height: 2px; background: rgba(244,239,232,.3); border-radius: 2px; transition: background .4s, width .4s; }
.dots i.on { background: var(--gold); width: 30px; }
.credit { font-size: 11px; color: rgba(244,239,232,.55); }
.credit a { color: inherit; }

/* Cartes photo */
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pc { position: relative; aspect-ratio: 3 / 4; border-radius: 22px; overflow: hidden; border: 0; padding: 0; cursor: pointer; background: var(--panel); text-align: left;
  opacity: 0; transform: translateY(18px); animation: up .6s cubic-bezier(.2,.8,.2,1) forwards; }
.pc.tall { aspect-ratio: 3 / 4.6; }
.pc img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .8s cubic-bezier(.2,.8,.2,1); }
.pc:hover img, .pc:focus-visible img { transform: scale(1.06); }
.pc::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, rgba(10,9,8,.85)); }
.pc span { position: absolute; left: 14px; right: 14px; bottom: 14px; z-index: 2; display: grid; gap: 2px; }
.pc b { font: 400 24px/1.1 var(--display); }
.pc small { color: #d4ccc0; font-size: 12.5px; }
@keyframes up { to { opacity: 1; transform: none; } }

/* Silhouettes */
.shapes { display: grid; gap: 10px; }
.shape { display: grid; grid-template-columns: 54px 1fr auto; gap: 14px; align-items: center; padding: 14px 18px; border-radius: 18px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; text-align: left;
  opacity: 0; transform: translateY(14px); animation: up .5s cubic-bezier(.2,.8,.2,1) forwards; transition: border-color .2s; }
.shape:hover { border-color: var(--gold); }
.shape svg { width: 54px; height: 64px; }
.shape b { font: 400 22px var(--display); display: block; }
.shape small { color: var(--muted); }
.shape em { font-style: normal; color: var(--gold); font-size: 20px; }

/* Analyse */
.scan-wrap { min-height: 70vh; display: grid; place-items: center; text-align: center; gap: 18px; }
.ring { width: 150px; height: 220px; position: relative; display: grid; place-items: center; }
.ring svg { width: 100%; height: 100%; }
.ring::after { content: ""; position: absolute; left: -10%; right: -10%; height: 3px; background: linear-gradient(90deg, transparent, var(--gold), transparent); box-shadow: 0 0 18px var(--gold); animation: sweep 1.2s ease-in-out infinite alternate; }
@keyframes sweep { from { top: 0; } to { top: 100%; } }
.steps { color: var(--muted); font-size: 14px; display: grid; gap: 6px; }
.steps span { opacity: .3; transition: opacity .4s, color .4s; }
.steps span.on { opacity: 1; color: var(--ink); }

/* Résultat */
.hero-look { position: relative; border-radius: 26px; overflow: hidden; aspect-ratio: 3 / 4.2; background: var(--panel); }
.hero-look img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; animation: fadein .9s ease both; }
@keyframes fadein { from { opacity: 0; transform: scale(1.04); } }
.hero-look::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,9,8,.0) 50%, rgba(10,9,8,.8)); pointer-events: none; }
.badge { position: absolute; top: 14px; left: 14px; z-index: 2; background: rgba(15,14,13,.6); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 99px; padding: 7px 12px; font-size: 13px; font-weight: 800; color: var(--gold); }
.hero-look .cap { position: absolute; left: 18px; right: 18px; bottom: 16px; z-index: 2; display: flex; justify-content: space-between; align-items: end; gap: 10px; }
.hero-look .cap b { font: 400 30px/1 var(--display); }
.hero-look .cap span { font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 5px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); }
.tabs button { border: 0; background: none; padding: 11px 4px; border-radius: 99px; cursor: pointer; color: var(--muted); font-weight: 700; font-size: 14px; transition: background .3s, color .3s; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.why { margin: 0; color: var(--muted); font-size: 14.5px; }
.why b { color: var(--ink); font-weight: 700; }
.items { display: grid; gap: 2px; border-radius: 20px; overflow: hidden; border: 1px solid var(--line); }
.item { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 16px; background: var(--panel); opacity: 0; animation: up .5s ease forwards; }
.sw { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); box-shadow: inset 0 -6px 12px rgba(0,0,0,.25); }
.item b { font-weight: 700; font-size: 15px; display: block; }
.item small { color: var(--muted); font-size: 12.5px; }
.item .p { font-weight: 800; font-variant-numeric: tabular-nums; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.me { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.me > div { position: relative; border-radius: 18px; overflow: hidden; aspect-ratio: 3 / 4; background: var(--panel); }
.me img { width: 100%; height: 100%; object-fit: cover; }
.me .lbl { position: absolute; left: 10px; bottom: 10px; font-size: 12px; font-weight: 800; background: rgba(15,14,13,.7); padding: 4px 9px; border-radius: 99px; }
.me .sc::after { content: ""; position: absolute; left: 0; right: 0; height: 3px; background: var(--gold); box-shadow: 0 0 16px var(--gold); animation: sweep 1.4s ease-in-out infinite alternate; }
.trybtn { width: 100%; height: 100%; border: 1px dashed var(--gold); background: rgba(216,185,138,.08); color: var(--gold); border-radius: 18px; font-weight: 800; font-size: 15px; cursor: pointer; padding: 12px; }
.reveal { animation: reveal 1.2s cubic-bezier(.2,.8,.2,1) both; }
@keyframes reveal { from { clip-path: inset(0 0 100% 0); filter: blur(8px); } to { clip-path: inset(0 0 0 0); filter: none; } }
.note { font-size: 13px; color: var(--muted); text-align: center; margin: 0; }
.restart { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; justify-self: center; font-size: 14px; }
.fade { animation: screenin .55s cubic-bezier(.2,.8,.2,1) both; }
@keyframes screenin { from { opacity: 0; transform: translateY(12px); } }
@media (prefers-reduced-motion: reduce) { *, *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; transition: none !important; } .pc, .shape, .item { opacity: 1; transform: none; } }
</style>

    let all = [...set, ...(sh ? [sh] : [])];
    const ou = (o === 'travail' || (o === 'soiree' && g === 'h')) && outers[0];
    if (ou && sum(all) + ou.p <= max) all.splice(set.length, 0, ou);
    return { items: all, fit: set.filter(x => x.m.includes(m)).length / set.length, price: sum(all) };
  }).filter(l => l.price <= max).sort((a, b) => b.fit - a.fit || a.price - b.price);
  const seen = new Set(), res = [];
  for (const l of full) { if (seen.has(l.items[0].id)) continue; seen.add(l.items[0].id); res.push(l); if (res.length === 3) break; }
  return res;
}

const shapeSvg = (k, stroke = 'currentColor') => { const [a, b, c] = MORPHS[k].s.map(v => v * 1.15);
  return `<svg viewBox="0 0 40 60" aria-hidden="true"><circle cx="20" cy="7" r="4.5" fill="none" stroke="${stroke}" stroke-width="1.2"/><path d="M${20 - a} 15 Q20 12 ${20 + a} 15 Q${20 + b + 1} 24 ${20 + b} 31 Q${20 + c + 1} 38 ${20 + c} 44 L${20 - c} 44 Q${20 - c - 1} 38 ${20 - b} 31 Q${20 - b - 1} 24 ${20 - a} 15 Z" fill="rgba(216,185,138,.12)" stroke="${stroke}" stroke-width="1.2"/><path d="M${20 - c * .6} 44 L${20 - 4} 58 M${20 + c * .6} 44 L${20 + 4} 58" stroke="${stroke}" stroke-width="1.2"/></svg>`; };

let slideTimer;
const SCREENS = {
  0: () => `<section class="home">
      <div class="slides">${PH.hero.map((p, i) => `<img src="${img(p, 1000)}" alt="" class="${i ? '' : 'on'}" ${i ? 'loading="lazy"' : 'fetchpriority="high"'}>`).join('')}</div>
      <div class="in">
        <span class="eyebrow">Ton styliste personnel</span>
        <h1>La tenue qui <i>te va</i>, en trois questions.</h1>
        <p class="sub">Ta silhouette, ton occasion : Cabine choisit les pièces qui te mettent en valeur.</p>
        <button class="cta" type="button" data-go="1">Trouver mon look</button>
        <div class="dots">${PH.hero.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div>
        <span class="credit" id="hcredit">${credit(PH.hero[0])}</span>
      </div></section>`,
  1: () => `<section class="screen fade"><span class="eyebrow">Étape 1 sur 3</span><h2>C'est pour <i>qui</i> ?</h2>
      <div class="cards">${[['f', 'Femme', PH.g_f[0]], ['h', 'Homme', PH.g_h[0]]].map(([v, t, p], i) => `<button class="pc tall" type="button" data-set="g:${v}" style="animation-delay:${i * 90}ms"><img src="${img(p, 600)}" alt=""><span><b>${t}</b></span></button>`).join('')}</div></section>`,
  2: () => `<section class="screen fade"><span class="eyebrow">Étape 2 sur 3</span><h2>Ta <i>silhouette</i></h2><p class="sub">Choisis celle qui te ressemble le plus.</p>
      <div class="shapes">${Object.entries(MORPHS).map(([k, v], i) => `<button class="shape" type="button" data-set="m:${k}" style="animation-delay:${i * 70}ms;color:var(--gold)">${shapeSvg(k)}<span style="color:var(--ink)"><b>${v.n}</b><small>${v.d}</small></span><em>→</em></button>`).join('')}</div></section>`,
  3: () => `<section class="screen fade"><span class="eyebrow">Étape 3 sur 3</span><h2>Pour quelle <i>occasion</i> ?</h2>
      <div class="cards">${Object.entries(OCCS).map(([k, t], i) => { const p = PH[state.g + '_' + k][0]; return `<button class="pc" type="button" data-set="o:${k}" style="animation-delay:${i * 70}ms"><img src="${img(p, 500)}" alt=""><span><b>${t}</b><small>${OSUB[k]}</small></span></button>`; }).join('')}</div></section>`,
  4: () => `<section class="screen fade"><div class="scan-wrap"><div><div class="ring" style="color:var(--gold);margin:0 auto">${shapeSvg(state.m)}</div></div>
      <h2>Ton look <i>se prépare</i></h2>
      <div class="steps"><span>Lecture de ta silhouette</span><span>Choix des coupes qui te vont</span><span>Assemblage de 3 tenues</span></div></div></section>`,
  5: () => {
    const L = looks(), l = L[state.pick], P = PH[state.g + '_' + state.o], p = P[state.pick % P.length];
    if (!l) return `<section class="screen fade"><h2>Pas encore de look pour ce choix</h2><button class="cta" type="button" data-restart>Recommencer</button></section>`;
    return `<section class="screen fade">
      <span class="eyebrow">${OCCS[state.o]} · ${MORPHS[state.m].n}</span>
      <h2>Tes 3 <i>looks</i></h2>
      <div class="tabs">${L.map((_, i) => `<button type="button" data-pick="${i}" aria-pressed="${i === state.pick}">Look ${i + 1}</button>`).join('')}</div>
      <div class="hero-look"><img src="${img(p, 1000)}" alt="Inspiration ${OCCS[state.o].toLowerCase()}" key="${state.pick}"><span class="badge">${Math.round(70 + l.fit * 28)} % fait pour toi</span>
        <div class="cap"><b>Look ${state.pick + 1}</b><span>${l.price} €</span></div></div>
      <span class="credit">${credit(p)}</span>
      <p class="why"><b>Pourquoi ce look :</b> ${MORPHS[state.m].t}</p>
      <div class="items">${l.items.map((x, i) => `<div class="item" style="animation-delay:${i * 80}ms"><span class="sw" style="background:${x.c}"></span><span><b>${x.n}</b><small>${x.w}</small></span><span class="p">${x.p} €</span></div>`).join('')}</div>
      ${state.photo ? tryBlock(p) : ''}
      <div class="row"><label class="ghost" for="photo" tabindex="0">${state.photo ? 'Changer ma photo' : '📷 Essayer sur moi'}</label>
        <a class="cta" href="https://www.vinted.fr/catalog?search_text=${encodeURIComponent(l.items[0].n)}" target="_blank" rel="noopener">Voir sur Vinted</a></div>
      <button class="restart" type="button" data-restart>Recommencer</button>
    </section>`;
  }
};

// Essayage IA : la photo de la personne + la photo du look, envoyées à FASHN via la fonction Supabase (la clé reste côté serveur)
const FN = 'https://ctgjnpxdaqdnrcxjwnkp.supabase.co/functions/v1/bright-endpoint';
const tries = {};
const tkey = () => `${state.g}_${state.o}_${state.pick}`;
const api = (d, signal) => fetch(FN, { method: 'POST', signal, headers: { 'Content-Type': 'application/json', apikey: 'sb_publishable_mz--wiLicR1GMDd2b3Fd2g_ewLTbr9h' }, body: JSON.stringify(d) }).then(r => r.json());
function tryBlock(p) {
  const t = tries[tkey()];
  const right = !t ? `<button class="trybtn" type="button" data-try>✨ Me voir avec ce look</button>`
    : t.st === 'run' ? `<div class="sc"><img src="${state.photo}" alt=""><span class="lbl">L'IA t'habille…</span></div>`
    : t.st === 'ok' ? `<img src="${t.url}" alt="Toi avec le look" class="reveal"><span class="lbl">Toi, look ${state.pick + 1}</span>`
    : `<button class="trybtn" type="button" data-try>Réessayer</button>`;
  return `<div class="me"><div><img src="${state.photo}" alt="Ta photo"><span class="lbl">Toi</span></div><div>${right}</div></div>
    <p class="note">${t && t.st === 'run' ? t.msg : t && t.st === 'err' ? `L'essayage n'a pas marché (${t.why}). Essaie une photo de face, en entier, bien éclairée.` : 'Photo de face, en entier, bien éclairée. Elle sert seulement à l\'essayage.'}</p>`;
}
async function tryOn() {
  const k = tkey(), P = PH[state.g + '_' + state.o], p = P[state.pick % P.length], t0 = Date.now();
  const say = m => { tries[k].msg = m; const n = document.querySelector('.note'); if (n && tkey() === k) n.textContent = m; };
  // Chaque appel a un délai maximum, pour ne jamais tourner sans fin
  const call = (d, ms) => { const c = new AbortController(), to = setTimeout(() => c.abort(), ms); return api(d, c.signal).finally(() => clearTimeout(to)); };
  tries[k] = { st: 'run', msg: 'Envoi de ta photo…' }; render();
  try {
    const r = await call({ action: 'run', body: { model_name: 'tryon-v1.6', inputs: { model_image: state.photo, garment_image: `${p.u}&w=768&q=85&fm=jpg` } } }, 45000);
    if (!r.id) throw new Error(r.message || r.error || 'refusé');
    while (Date.now() - t0 < 120000) {
      await new Promise(f => setTimeout(f, 2500));
      const s = await call({ action: 'status', id: r.id }, 20000).catch(() => ({}));
      say(`L'IA t'habille… ${Math.round((Date.now() - t0) / 1000)} s`);
      if (s.status === 'completed' && s.output) { tries[k] = { st: 'ok', url: s.output[0] }; break; }
      if (s.status === 'failed') throw new Error((s.error && (s.error.message || s.error.name)) || 'échec');
    }
    if (tries[k].st !== 'ok') throw new Error('trop long');
  } catch (e) { tries[k] = { st: 'err', why: e.name === 'AbortError' ? 'pas de réponse du serveur' : String(e.message || e) }; }
  if (tkey() === k && state.step === 5) render();
}
// Réduit la photo avant l'envoi (plus rapide, moins lourd)
function shrink(file) {
  return new Promise(res => { const im = new Image(); im.onload = () => {
    const sc = Math.min(1, 1024 / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = im.width * sc; c.height = im.height * sc; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    res(c.toDataURL('image/jpeg', .88)); URL.revokeObjectURL(im.src); }; im.src = URL.createObjectURL(file); });
}

function render() {
  clearInterval(slideTimer);
  $('#app').innerHTML = SCREENS[state.step]();
  $('#back').hidden = state.step === 0 || state.step === 4;
  $('.top').style.background = state.step === 0 ? 'none' : '';
  $('#prog').style.width = ({ 0: 0, 1: 25, 2: 50, 3: 75, 4: 90, 5: 100 })[state.step] + '%';
  scrollTo(0, 0);
  if (state.step === 0) {
    let i = 0; const imgs = document.querySelectorAll('.slides img'), dots = document.querySelectorAll('.dots i');
    slideTimer = setInterval(() => { imgs[i].classList.remove('on'); dots[i].classList.remove('on'); i = (i + 1) % imgs.length; imgs[i].classList.add('on'); dots[i].classList.add('on'); $('#hcredit').innerHTML = credit(PH.hero[i]); }, 5000);
  }
  if (state.step === 4) {
    const s = document.querySelectorAll('.steps span');
    s.forEach((x, i) => setTimeout(() => x.classList.add('on'), 250 + i * 650));
    setTimeout(() => { if (state.step === 4) { state.step = 5; render(); } }, 2400);
  }
}
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id === 'back') { state.step = state.step === 5 ? 3 : Math.max(0, state.step - 1); state.pick = 0; }
  else if (t.dataset.go) state.step = +t.dataset.go;
  else if (t.dataset.set) { const [k, v] = t.dataset.set.split(':'); state[k] = v; state.step++; state.pick = 0; }
  else if (t.dataset.pick) state.pick = +t.dataset.pick;
  else if ('try' in t.dataset) { tryOn(); return; }
  else if ('restart' in t.dataset) Object.assign(state, { step: 1, g: null, m: null, o: null, pick: 0 });
  else return;
  render();
});
document.addEventListener('keydown', e => { if (e.target.matches('label[for=photo]') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); $('#photo').click(); } });
$('#photo').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  shrink(f).then(d => { state.photo = d; for (const k in tries) delete tries[k]; e.target.value = ''; if (state.step === 5) tryOn(); else render(); });
});
render();
</script>
