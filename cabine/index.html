<style>
:root {
  --bg: #fbf7f4; --panel: #ffffff; --ink: #2a2120; --muted: #8a7d78; --line: #eadfd8;
  --rose: #c58b8f; --gold: #b8935a; --blush: #f6e6e3; --sage: #e7ece6;
  --display: "Bodoni Moda", Didot, Georgia, serif; --body: "Manrope", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); }
button { font: inherit; color: inherit; }
img { display: block; max-width: 100%; }

/* Décor : halos doux et étincelles dorées */
.deco { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.deco i { position: absolute; border-radius: 50%; filter: blur(50px); opacity: .55; animation: float 14s ease-in-out infinite alternate; }
.deco i:nth-child(1) { width: 320px; height: 320px; background: #f3d9d6; top: -80px; right: -90px; }
.deco i:nth-child(2) { width: 280px; height: 280px; background: #efe3cf; bottom: 10%; left: -110px; animation-delay: -5s; }
.deco i:nth-child(3) { width: 220px; height: 220px; background: #e3eadf; bottom: -60px; right: -40px; animation-delay: -9s; }
@keyframes float { to { transform: translate(30px, 40px) scale(1.1); } }
.spark { position: absolute; color: var(--gold); font-size: 14px; animation: twinkle 3s ease-in-out infinite; }
@keyframes twinkle { 50% { opacity: .2; transform: scale(.6) rotate(20deg); } }

.app { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; min-height: 100vh; min-height: 100dvh;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 32px) max(18px, env(safe-area-inset-left, 0px)); }
.top { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; margin-bottom: 8px; }
.logo { grid-column: 2; text-align: center; font: italic 400 30px/1 var(--display); }
.logo b { font-style: normal; font-weight: 600; color: var(--rose); }
.back { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: 18px; box-shadow: 0 4px 14px rgba(120,80,70,.08); }
.dots { display: flex; justify-content: center; gap: 6px; margin: 4px 0 18px; }
.dots i { width: 6px; height: 6px; border-radius: 99px; background: var(--line); transition: all .4s; }
.dots i.on { width: 22px; background: var(--rose); }

.screen { display: grid; gap: 18px; animation: screenin .6s cubic-bezier(.2,.8,.2,1) both; }
@keyframes screenin { from { opacity: 0; transform: translateY(14px); } }
.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); text-align: center; }
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; text-align: center; text-wrap: balance; }
h1 { font-size: clamp(38px, 10.5vw, 54px); line-height: 1.02; }
h2 { font-size: clamp(30px, 8vw, 38px); line-height: 1.08; }
h1 i, h2 i { color: var(--rose); }
.sub { color: var(--muted); text-align: center; margin: -6px auto 0; max-width: 34ch; }

.cta { display: block; width: 100%; border: 0; border-radius: 99px; padding: 18px 24px; cursor: pointer; font-weight: 800; font-size: 16px; letter-spacing: .02em; text-align: center; text-decoration: none;
  color: #fff; background: linear-gradient(135deg, #d39ea1, var(--rose) 50%, #a96f74); box-shadow: 0 12px 28px rgba(197,139,143,.35); position: relative; overflow: hidden; transition: transform .2s; }
.cta::after { content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); transform: skewX(-20deg); animation: shine 3.2s ease-in-out infinite; }
@keyframes shine { 60%, 100% { left: 130%; } }
.cta:active { transform: scale(.98); }
.cta[disabled] { opacity: .45; pointer-events: none; }
.ghost { display: block; width: 100%; border: 1px solid var(--line); border-radius: 99px; padding: 15px 20px; background: var(--panel); cursor: pointer; font-weight: 700; text-align: center; text-decoration: none; color: var(--ink); }
button:focus-visible, a:focus-visible, label:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; }

/* Le miroir : arche dorée */
.mirror { position: relative; width: min(100%, 330px); margin: 6px auto 0; padding: 10px; border-radius: 200px 200px 26px 26px;
  background: linear-gradient(160deg, #e8cf9f, var(--gold) 40%, #e9d6ae 70%, #a8814a); box-shadow: 0 24px 50px rgba(120,80,60,.18); }
.mirror.small { width: min(100%, 250px); }
.glass { position: relative; aspect-ratio: 3 / 4.3; border-radius: 190px 190px 18px 18px; overflow: hidden; background: linear-gradient(180deg, #fff, var(--blush)); }
.glass > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.glass .empty { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 10px; color: var(--muted); text-align: center; padding: 20px; font-size: 14px; }
.glass .empty b { font: 400 22px var(--display); color: var(--ink); }
.glass .plus { width: 64px; height: 64px; border-radius: 50%; border: 1.5px dashed var(--rose); display: grid; place-items: center; font-size: 28px; color: var(--rose); }
.glass.scan::after { content: ""; position: absolute; left: 0; right: 0; height: 30%; top: -30%; background: linear-gradient(180deg, transparent, rgba(197,139,143,.45), transparent); animation: sweep 1.6s ease-in-out infinite; }
@keyframes sweep { to { top: 100%; } }
.reveal { animation: reveal 1.3s cubic-bezier(.2,.8,.2,1) both; }
@keyframes reveal { from { clip-path: inset(0 0 100% 0); filter: blur(10px); } to { clip-path: inset(0); filter: none; } }
.mirror .spark:nth-of-type(1) { top: 8%; left: -14px; } .mirror .spark:nth-of-type(2) { top: 40%; right: -16px; animation-delay: -1s; font-size: 18px; } .mirror .spark:nth-of-type(3) { bottom: 10%; left: -10px; animation-delay: -2s; }
.tag { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: rgba(255,255,255,.88); backdrop-filter: blur(8px); border-radius: 99px; padding: 6px 14px; font-size: 13px; font-weight: 800; white-space: nowrap; }

.tips { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.tips span { font-size: 12.5px; background: var(--panel); border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; color: var(--muted); }

/* Choix */
.options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.opt { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 20px 12px; display: grid; justify-items: center; gap: 6px; cursor: pointer; text-align: center; box-shadow: 0 6px 18px rgba(120,80,70,.06);
  opacity: 0; transform: translateY(14px); animation: up .55s cubic-bezier(.2,.8,.2,1) forwards; transition: border-color .2s, box-shadow .2s, transform .2s; }
.opt:hover { border-color: var(--rose); box-shadow: 0 10px 24px rgba(197,139,143,.2); }
.opt:active { transform: scale(.97); }
.opt .e { font-size: 34px; line-height: 1.1; }
.opt b { font: 400 21px var(--display); }
.opt small { color: var(--muted); font-size: 12.5px; line-height: 1.3; }
.opt svg { width: 44px; height: 62px; }
.opt.wide { grid-column: 1 / -1; grid-template-columns: 50px 1fr; justify-items: start; text-align: left; padding: 14px 18px; }
@keyframes up { to { opacity: 1; transform: none; } }

/* Préparation */
.steps { display: grid; gap: 10px; max-width: 300px; margin: 0 auto; width: 100%; }
.steps span { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14.5px; opacity: .45; transition: all .4s; }
.steps span::before { content: ""; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; transition: all .4s; }
.steps span.on { opacity: 1; color: var(--ink); }
.steps span.on::before { background: var(--rose); border-color: var(--rose); box-shadow: inset 0 0 0 3px #fff; }

/* Résultat */
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 5px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 10px 4px; border-radius: 99px; cursor: pointer; color: var(--muted); font-weight: 700; font-size: 14px; transition: all .3s; position: relative; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.tabs button .ld { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--rose); margin-left: 6px; vertical-align: middle; animation: twinkle 1s infinite; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 16px; display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; align-items: center; box-shadow: 0 8px 22px rgba(120,80,70,.06); }
.card .piece { width: 92px; aspect-ratio: 3 / 4; border-radius: 16px; overflow: hidden; background: var(--blush); }
.card .piece img { width: 100%; height: 100%; object-fit: cover; }
.card b { font: 400 21px/1.15 var(--display); display: block; }
.card .price { font-weight: 800; color: var(--rose); font-variant-numeric: tabular-nums; }
.card small { color: var(--muted); display: block; font-size: 13px; margin-top: 4px; }
.why { margin: 0; text-align: center; color: var(--muted); font-size: 14.5px; }
.why b { color: var(--ink); }
.match { display: inline-block; font-size: 12.5px; font-weight: 800; color: var(--gold); background: #f7efe1; padding: 4px 10px; border-radius: 99px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.note { font-size: 13px; color: var(--muted); text-align: center; margin: 0; }
.credit { font-size: 11px; color: var(--muted); text-align: center; }
.credit a { color: inherit; }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; justify-self: center; font-size: 14px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; transition: none !important; } .opt { opacity: 1; transform: none; } }
</style>
</head>

  <div class="top"><button class="back" type="button" id="back" aria-label="Retour" hidden>←</button><div class="logo">Ca<b>bine</b></div></div>
  <div class="dots" id="dots"></div>
  <main id="app"></main>
  <input id="photo" type="file" accept="image/*" hidden>
</div>

3wxMTE2NDI3fDB8MXxzZWFyY2h8M3x8cG9sbyUyMHNoaXJ0fGVufDF8fHx8MTc5MzIxODA4OHww&ixlib=rb-4.1.0", "by": "Clément Vatte", "user": "https://unsplash.com/@clement_vatte", "n": "Polo noir", "p": 35, "m": "VHXA", "a": "Chino beige et baskets"}, "84": {"u": "https://images.unsplash.com/photo-1592343516109-362f7bd871aa?ixid=M3wxMTE2NDI3fDB8MXxzZWFyY2h8MXx8YmxhemVyJTIwb24lMjBoYW5nZXJ8ZW58MXx8fHwxNzkzMjE4MDg2fDA&ixlib=rb-4.1.0", "by": "Victoria Priessnitz", "user": "https://unsplash.com/@victoriapriessnitz", "n": "Veste de costume noire", "p": 119, "m": "VHXAO", "a": "Chemise blanche et pantalon gris"}, "83": {"u": "https://images.unsplash.com/photo-1621773881532-fe65715b5137?ixid=M3wxMTE2NDI3fDB8MXxzZWFyY2h8MTJ8fGJsb3VzZSUyMG9uJTIwaGFuZ2VyfGVufDF8fHx8MTc5MzIxODA4Nnww&ixlib=rb-4.1.0", "by": "Lisanto 李奕良", "user": "https://unsplash.com/@lisanto_", "n": "Chemise blanche", "p": 39, "m": "VHXAO", "a": "Pantalon fuselé et ceinture cuir"}, "180": {"u": "https://images.unsplash.com/photo-1581655353564-df123a1eb820?ixid=M3wxMTE2NDI3fDB8MXxzZWFyY2h8MXx8cG9sbyUyMHNoaXJ0fGVufDF8fHx8MTc5MzIxODA4OHww&ixlib=rb-4.1.0", "by": "Haryo Setyadi", "user": "https://unsplash.com/@uyk", "n": "T-shirt blanc", "p": 19, "m": "VHXAO", "a": "Jogging et baskets"}, "196": {"u": "https://images.unsplash.com/photo-1739384994765-d44f7af12029?ixid=M3wxMTE2NDI3fDB8MXxzZWFyY2h8NXx8aG9vZGllJTIwZmxhdCUyMGxheXxlbnwxfHx8fDE3OTMyMTgwODh8MA&ixlib=rb-4.1.0", "by": "philippe wehrli", "user": "https://unsplash.com/@philippewehrli", "n": "Sweat bleu et jean", "p": 69, "m": "VHXAO", "a": "Baskets de course"}, "125": {"u": "https://images.unsplash.com/photo-1739384879592-79903b12b2a6?ixid=M3wxMTE2NDI3fDB8MXxzZWFyY2h8Nnx8amVhbnMlMjBhbmQlMjBzaGlydCUyMGZsYXQlMjBsYXl8ZW58MXx8fHwxNzkzMjE4MDg3fDA&ixlib=rb-4.1.0", "by": "philippe wehrli", "user": "https://unsplash.com/@philippewehrli", "n": "Veste beige et jean", "p": 99, "m": "VHXAO", "a": "Baskets blanches"}, "183": {"u": "https://images.unsplash.com/photo-1671438118097-479e63198629?ixid=M3wxMTE2NDI3fDB8MXxzZWFyY2h8NHx8cG9sbyUyMHNoaXJ0fGVufDF8fHx8MTc5MzIxODA4OHww&ixlib=rb-4.1.0", "by": "Mediamodifier", "user": "https://unsplash.com/@mediamodifier", "n": "Polo blanc", "p": 35, "m": "VHXAO", "a": "Short chino et sneakers"}}, "L": {"f_soiree": [30, 40, 2], "f_rdv": [14, 30, 69], "f_travail": [175, 11, 2], "f_mariage": [69, 14, 30], "f_sport": [117, 110, 192], "f_casual": [129, 165, 192], "h_soiree": [91, 89, 85], "h_rdv": [95, 159, 182], "h_travail": [84, 83, 175], "h_mariage": [91, 175, 85], "h_sport": [180, 192, 196], "h_casual": [125, 196, 183]}};
const UTM = '?utm_source=cabine&utm_medium=referral';
const pic = (g, w = 700) => `${g.u}&w=${w}&q=75&fm=jpg&fit=crop&crop=entropy`;
const credit = g => `Pièce : photo <a href="${g.user}${UTM}" target="_blank" rel="noopener">${g.by}</a> / <a href="https://unsplash.com/${UTM}" target="_blank" rel="noopener">Unsplash</a>`;

const MORPHS = {
  X: { n: 'Sablier', d: 'Taille marquée', s: [15, 9, 15], t: 'On suit ta taille sans cacher tes courbes.' },
  A: { n: 'Triangle', d: 'Hanches plus larges', s: [10, 12, 16], t: 'On attire le regard vers le haut.' },
  V: { n: 'Triangle inversé', d: 'Épaules plus larges', s: [16, 12, 10], t: 'On adoucit les épaules et on équilibre le bas.' },
  H: { n: 'Rectangle', d: 'Tout est aligné', s: [13, 13, 13], t: 'On crée une taille avec des coupes structurées.' },
  O: { n: 'Ronde', d: 'Volume au ventre', s: [14, 16, 14], t: 'On allonge avec des lignes verticales.' }
};
const OCCS = { soiree: ['🥂', 'Soirée', 'Chic et lumineux'], rdv: ['🌹', 'Rendez-vous', 'Séduisant, pas trop'], travail: ['💼', 'Travail', 'Net et assuré'],
  mariage: ['💍', 'Mariage', 'Élégant et de saison'], sport: ['🏃', 'Sport', 'Beau et confortable'], casual: ['☀️', 'Week-end', 'Facile et stylé'] };
const state = { step: 0, photo: null, g: null, m: null, o: null, pick: 0 };
const tries = {};

// Les 3 looks : les pièces qui mettent le plus en valeur la silhouette passent en premier
function looks() {
  return DATA.L[state.g + '_' + state.o].map(id => ({ id, ...DATA.g[id] }))
    .map(x => ({ ...x, fit: x.m.includes(state.m) ? 1 : 0 })).sort((a, b) => b.fit - a.fit);
}

/* ---------- Essayage IA (FASHN via la fonction Supabase, la clé reste côté serveur) ---------- */
const FN = 'https://ctgjnpxdaqdnrcxjwnkp.supabase.co/functions/v1/bright-endpoint';
const api = (d, ms) => { const c = new AbortController(), to = setTimeout(() => c.abort(), ms);
  return fetch(FN, { method: 'POST', signal: c.signal, headers: { 'Content-Type': 'application/json', apikey: 'sb_publishable_mz--wiLicR1GMDd2b3Fd2g_ewLTbr9h' }, body: JSON.stringify(d) })
    .then(r => r.json()).finally(() => clearTimeout(to)); };
async function tryOn(look) {
  const k = state.g + state.o + look.id;
  if (tries[k] && tries[k].st !== 'err') return;
  tries[k] = { st: 'run' }; const t0 = Date.now();
  try {
    const r = await api({ action: 'run', body: { model_name: 'tryon-v1.6', inputs: { model_image: state.photo, garment_image: pic(look, 768) } } }, 45000);
    if (!r.id) throw new Error(r.message || r.error || 'refusé');
    while (Date.now() - t0 < 120000) {
      await new Promise(f => setTimeout(f, 2500));
      const s = await api({ action: 'status', id: r.id }, 20000).catch(() => ({}));
      if (s.status === 'completed' && s.output) { tries[k] = { st: 'ok', url: s.output[0] }; break; }
      if (s.status === 'failed') throw new Error('échec');
    }
    if (tries[k].st !== 'ok') throw new Error('trop long');
  } catch (e) { tries[k] = { st: 'err', why: e.name === 'AbortError' ? 'pas de réponse' : e.message }; }
  if (state.step >= 5) render(true);
}
const tryOf = look => tries[state.g + state.o + look.id];

function shrink(file) {
  const raw = () => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => res(null); r.readAsDataURL(file); });
  return new Promise(res => {
    const im = new Image(), url = URL.createObjectURL(file), done = v => { clearTimeout(to); URL.revokeObjectURL(url); res(v); };
    const to = setTimeout(() => raw().then(done), 8000);
    im.onload = () => { try {
      const sc = Math.min(1, 1024 / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement('canvas');
      c.width = Math.round(im.naturalWidth * sc); c.height = Math.round(im.naturalHeight * sc); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      done(c.toDataURL('image/jpeg', .88)); } catch (_) { raw().then(done); } };
    im.onerror = () => raw().then(done); im.src = url;
  });
}

/* ---------- Écrans ---------- */
const sparks = '<span class="spark">✦</span><span class="spark">✧</span><span class="spark">✦</span>';
const shapeSvg = k => { const [a, b, c] = MORPHS[k].s.map(v => v * 1.15);
  return `<svg viewBox="0 0 40 60" aria-hidden="true"><circle cx="20" cy="7" r="4.5" fill="none" stroke="#c58b8f" stroke-width="1.3"/><path d="M${20 - a} 15 Q20 12 ${20 + a} 15 Q${20 + b + 1} 24 ${20 + b} 31 Q${20 + c + 1} 38 ${20 + c} 44 L${20 - c} 44 Q${20 - c - 1} 38 ${20 - b} 31 Q${20 - b - 1} 24 ${20 - a} 15 Z" fill="#f6e6e3" stroke="#c58b8f" stroke-width="1.3"/><path d="M${20 - c * .6} 44 L16 58 M${20 + c * .6} 44 L24 58" stroke="#c58b8f" stroke-width="1.3"/></svg>`; };
const heroPiece = DATA.g['30'];

const S = [
  () => `<section class="screen">
      <span class="eyebrow">Ta cabine d'essayage</span>
      <h1>Essaie les looks <i>sur toi</i>, sans bouger.</h1>
      <div class="mirror small">${sparks}<div class="glass"><img src="${pic(heroPiece, 600)}" alt="Robe rouge sur un mannequin de vitrine"></div></div>
      <p class="sub">Une photo de toi, trois questions, et tu te vois porter les tenues qui te vont.</p>
      <button class="cta" type="button" data-go="1">Commencer</button>
      <span class="credit">${credit(heroPiece).replace('Pièce : photo', 'Photo')}</span>
    </section>`,
  () => `<section class="screen">
      <span class="eyebrow">Étape 1 sur 4</span><h2>Ta <i>photo</i></h2>
      <label class="mirror" for="photo" tabindex="0" style="cursor:pointer;display:block">${sparks}<div class="glass">${state.photo ? `<img src="${state.photo}" alt="Ta photo" class="reveal">` : `<div class="empty"><span class="plus">+</span><b>Ajoute ta photo</b>Elle sert seulement à t'habiller.</div>`}</div></label>
      <div class="tips"><span>De face</span><span>En entier</span><span>Bien éclairée</span></div>
      <button class="cta" type="button" data-go="2" ${state.photo ? '' : 'disabled'}>Continuer</button>
      ${state.photo ? `<label class="link" for="photo" tabindex="0">Changer de photo</label>` : ''}
    </section>`,
  () => `<section class="screen"><span class="eyebrow">Étape 2 sur 4</span><h2>C'est pour <i>qui</i> ?</h2>
      <div class="options">${[['f', '👗', 'Femme'], ['h', '👔', 'Homme']].map(([v, e, t], i) => `<button class="opt" type="button" data-set="g:${v}" style="animation-delay:${i * 80}ms"><span class="e">${e}</span><b>${t}</b></button>`).join('')}</div></section>`,
  () => `<section class="screen"><span class="eyebrow">Étape 3 sur 4</span><h2>Ta <i>silhouette</i></h2><p class="sub">Celle qui te ressemble le plus.</p>
      <div class="options">${Object.entries(MORPHS).map(([k, v], i) => `<button class="opt wide" type="button" data-set="m:${k}" style="animation-delay:${i * 60}ms">${shapeSvg(k)}<span><b>${v.n}</b><small>${v.d}</small></span></button>`).join('')}</div></section>`,
  () => `<section class="screen"><span class="eyebrow">Étape 4 sur 4</span><h2>Pour quelle <i>occasion</i> ?</h2>
      <div class="options">${Object.entries(OCCS).map(([k, [e, t, d]], i) => `<button class="opt" type="button" data-set="o:${k}" style="animation-delay:${i * 60}ms"><span class="e">${e}</span><b>${t}</b><small>${d}</small></button>`).join('')}</div></section>`,
  () => `<section class="screen">
      <span class="eyebrow">${OCCS[state.o][1]} · ${MORPHS[state.m].n}</span><h2>On t'habille<i>…</i></h2>
      <div class="mirror">${sparks}<div class="glass scan"><img src="${state.photo}" alt="Ta photo"></div></div>
      <div class="steps"><span>Lecture de ta silhouette</span><span>Choix des 3 pièces qui te vont</span><span>Essayage sur ta photo</span></div>
      <p class="note">Environ 15 secondes</p>
    </section>`,
  () => {
    const L = looks(), l = L[state.pick], t = tryOf(l) || {};
    const view = t.st === 'ok' ? `<img src="${t.url}" alt="Toi avec ${l.n}" class="reveal">` : `<img src="${state.photo}" alt="Ta photo">`;
    return `<section class="screen">
      <span class="eyebrow">${OCCS[state.o][1]} · ${MORPHS[state.m].n}</span><h2>Tes 3 <i>looks</i></h2>
      <div class="tabs">${L.map((x, i) => { const s = tryOf(x) || {}; return `<button type="button" data-pick="${i}" aria-pressed="${i === state.pick}">Look ${i + 1}${s.st === 'run' ? '<span class="ld"></span>' : ''}</button>`; }).join('')}</div>
      <div class="mirror">${sparks}<div class="glass ${t.st === 'run' ? 'scan' : ''}">${view}<span class="tag">${t.st === 'run' ? 'L\'IA t\'habille…' : t.st === 'ok' ? `Toi · Look ${state.pick + 1}` : t.st === 'err' ? 'Essayage impossible' : ''}</span></div></div>
      ${t.st === 'err' ? `<p class="note">Ça n'a pas marché (${t.why}). Essaie une photo de face, en entier. <button class="link" type="button" data-retry>Réessayer</button></p>` : ''}
      <p class="why"><span class="match">${l.fit ? 'Idéal pour ta silhouette' : 'Va bien avec ta silhouette'}</span><br>${MORPHS[state.m].t}</p>
      <div class="card"><div class="piece"><img src="${pic(l, 300)}" alt="${l.n}"></div><div><b>${l.n}</b><span class="price">≈ ${l.p} €</span><small>À porter avec : ${l.a}</small></div></div>
      <div class="row"><label class="ghost" for="photo" tabindex="0">Changer de photo</label>
        <a class="cta" href="https://www.vinted.fr/catalog?search_text=${encodeURIComponent(l.n)}" target="_blank" rel="noopener">Trouver sur Vinted</a></div>
      <span class="credit">${credit(l)}</span>
      <button class="link" type="button" data-restart>Recommencer</button>
    </section>`;
  }
];

function render(soft) {
  if (soft && state.step === 5) { const st = looks().map(x => (tryOf(x) || {}).st); if (st.includes('ok') || !st.includes('run')) state.step = 6; }
  const y = scrollY;
  $('#app').innerHTML = S[state.step]();
  if (state.step === 6 && soft) { $('#app .screen').style.animation = 'none'; scrollTo(0, y); } else scrollTo(0, 0);
  $('#back').hidden = state.step === 0 || state.step === 5;
  $('#dots').innerHTML = [1, 2, 3, 4, 6].map(s => `<i class="${state.step >= s ? 'on' : ''}"></i>`).join('');
  if (state.step === 5 && !soft) document.querySelectorAll('.steps span').forEach((x, i) => setTimeout(() => x.classList.add('on'), 400 + i * 900));
  if (state.step === 5 && soft) document.querySelectorAll('.steps span').forEach(x => x.classList.add('on'));
}
function launch() {
  state.step = 5; state.pick = 0; render();
  const L = looks(); tryOn(L[0]); setTimeout(() => { tryOn(L[1]); tryOn(L[2]); }, 1500);
}
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id === 'back') { state.step = state.step === 6 ? 4 : Math.max(0, state.step - 1); }
  else if (t.dataset.go) state.step = +t.dataset.go;
  else if (t.dataset.set) { const [k, v] = t.dataset.set.split(':'); state[k] = v; if (k === 'o') return launch(); state.step++; }
  else if (t.dataset.pick) { state.pick = +t.dataset.pick; render(true); return; }
  else if ('retry' in t.dataset) { tryOn(looks()[state.pick]); render(true); return; }
  else if ('restart' in t.dataset) Object.assign(state, { step: 2, g: null, m: null, o: null, pick: 0 });
  else return;
  render();
});
document.addEventListener('keydown', e => { if (e.target.matches('label[for=photo]') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); $('#photo').click(); } });
$('#photo').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  shrink(f).then(d => { e.target.value = ''; if (!d) return;
    state.photo = d; for (const k in tries) delete tries[k];
    if (state.step === 6) launch(); else render(); });
});
render();
</script>
