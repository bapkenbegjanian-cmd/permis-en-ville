<style>
:root {
  --ink: #1d1530; --muted: #6f6688; --line: rgba(29,21,48,.1); --glass: rgba(255,255,255,.62);
  --pink: #ff5d8f; --violet: #7b5cff; --peach: #ffb37a; --mint: #3dd6b5;
  --grad: linear-gradient(120deg, var(--pink), var(--violet));
  --display: "Syne", "Arial Black", sans-serif; --body: "Plus Jakarta Sans", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; color: var(--ink); font: 16px/1.5 var(--body); background: #fdf1f5; }
button { font: inherit; color: inherit; }
img { display: block; max-width: 100%; }

/* Fond animé : dégradé vivant */
.bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: linear-gradient(160deg, #fff4f7, #f4efff 55%, #fff6ee); }
.bg i { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .7; animation: blob 16s ease-in-out infinite alternate; }
.bg i:nth-child(1) { width: 380px; height: 380px; background: #ffc2d6; top: -120px; left: -100px; }
.bg i:nth-child(2) { width: 340px; height: 340px; background: #d9ccff; top: 30%; right: -140px; animation-delay: -6s; }
.bg i:nth-child(3) { width: 300px; height: 300px; background: #ffe0c2; bottom: -100px; left: 10%; animation-delay: -11s; }
@keyframes blob { 50% { transform: translate(60px, 50px) scale(1.15); } 100% { transform: translate(-30px, 80px) scale(.95); } }

.app { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; min-height: 100vh; min-height: 100dvh;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 32px) max(18px, env(safe-area-inset-left, 0px)); }
.top { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; margin-bottom: 14px; }
.logo { grid-column: 2; text-align: center; font: 800 26px/1 var(--display); letter-spacing: -.02em; }
.logo span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.back { width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(12px); cursor: pointer; font-size: 18px; }

.screen { display: grid; gap: 18px; animation: screenin .6s cubic-bezier(.2,.8,.2,1) both; }
@keyframes screenin { from { opacity: 0; transform: translateY(16px) scale(.99); } }
h1, h2 { font-family: var(--display); font-weight: 800; margin: 0; letter-spacing: -.03em; text-wrap: balance; }
h1 { font-size: clamp(40px, 11.5vw, 60px); line-height: .95; }
h2 { font-size: clamp(30px, 8.5vw, 40px); line-height: 1; }
.hl { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { color: var(--muted); margin: 0; max-width: 36ch; }
.pill { display: inline-flex; align-items: center; gap: 8px; width: max-content; font-size: 13px; font-weight: 700; padding: 7px 12px; border-radius: 99px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(12px); }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 4px rgba(61,214,181,.2); animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(61,214,181,0); } }

.cta { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; border: 0; border-radius: 18px; padding: 18px 24px; cursor: pointer; font-weight: 800; font-size: 17px; text-decoration: none;
  color: #fff; background: var(--grad); background-size: 200% 100%; box-shadow: 0 14px 30px rgba(123,92,255,.3); animation: gradmove 5s ease infinite; transition: transform .15s; }
@keyframes gradmove { 50% { background-position: 100% 0; } }
.cta:active { transform: scale(.97); }
.cta[disabled] { opacity: .4; pointer-events: none; }
.ghost { display: flex; align-items: center; justify-content: center; width: 100%; border: 1px solid var(--line); border-radius: 18px; padding: 16px 20px; background: var(--glass); backdrop-filter: blur(12px); cursor: pointer; font-weight: 700; text-align: center; text-decoration: none; color: var(--ink); }
button:focus-visible, a:focus-visible, label:focus-visible { outline: 3px solid var(--violet); outline-offset: 3px; }

/* Accueil */
.showcase { position: relative; height: 380px; margin: 6px 0; }
.showcase .card { position: absolute; width: 58%; aspect-ratio: 3 / 4; border-radius: 26px; overflow: hidden; box-shadow: 0 24px 50px rgba(29,21,48,.18); border: 4px solid #fff; background: #fff; transition: all .9s cubic-bezier(.2,.8,.2,1); }
.showcase .card img { width: 100%; height: 100%; object-fit: cover; }
.showcase .c0 { left: 21%; top: 0; z-index: 3; transform: rotate(0); }
.showcase .c1 { left: 0; top: 40px; z-index: 2; transform: rotate(-9deg) scale(.86); opacity: .9; }
.showcase .c2 { left: 42%; top: 40px; z-index: 1; transform: rotate(9deg) scale(.86); opacity: .9; }
.float { position: absolute; z-index: 5; font-size: 13px; font-weight: 800; padding: 9px 13px; border-radius: 14px; background: #fff; box-shadow: 0 10px 24px rgba(29,21,48,.14); animation: bob 4s ease-in-out infinite; white-space: nowrap; }
.float.a { left: -4px; top: 18px; } .float.b { right: -4px; top: 170px; animation-delay: -1.3s; } .float.c { left: 8px; bottom: 6px; animation-delay: -2.6s; }
@keyframes bob { 50% { transform: translateY(-10px); } }
.marquee { overflow: hidden; margin: 0 -18px; padding: 12px 0; background: var(--ink); color: #fff; transform: rotate(-2deg); }
.marquee div { display: flex; gap: 28px; width: max-content; animation: slide 22s linear infinite; font: 800 15px var(--display); letter-spacing: .04em; text-transform: uppercase; }
.marquee b { color: var(--peach); }
@keyframes slide { to { transform: translateX(-50%); } }
.how { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.how div { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 18px; padding: 12px 10px; text-align: center; font-size: 12.5px; font-weight: 700; }
.how span { display: block; font-size: 24px; margin-bottom: 4px; }

/* Cadre photo : la photo entière, jamais coupée */
.frame { position: relative; width: 100%; aspect-ratio: 3 / 4; border-radius: 28px; overflow: hidden; background: #fff; box-shadow: 0 24px 50px rgba(29,21,48,.16); border: 4px solid #fff; }
.frame .blur { position: absolute; inset: -20px; background-size: cover; background-position: center; filter: blur(24px) saturate(1.2); opacity: .55; }
.frame > img, .frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.frame .empty { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 10px; text-align: center; padding: 24px; color: var(--muted); font-size: 14px;
  background: repeating-linear-gradient(135deg, rgba(123,92,255,.04) 0 12px, transparent 12px 24px); border: 2px dashed rgba(123,92,255,.35); border-radius: 24px; }
.frame .empty b { font: 800 22px var(--display); color: var(--ink); }
.frame .plus { width: 72px; height: 72px; border-radius: 22px; background: var(--grad); color: #fff; display: grid; place-items: center; font-size: 34px; box-shadow: 0 12px 26px rgba(255,93,143,.35); }
.frame .badge { position: absolute; left: 12px; top: 12px; z-index: 3; font-size: 12.5px; font-weight: 800; padding: 7px 11px; border-radius: 12px; background: rgba(255,255,255,.9); }
.frame.scan::after { content: ""; position: absolute; left: 0; right: 0; height: 3px; top: 0; background: var(--grad); box-shadow: 0 0 22px 6px rgba(123,92,255,.45); animation: scanline 2.2s ease-in-out infinite alternate; z-index: 2; }
@keyframes scanline { to { top: 100%; } }
.reveal { animation: reveal 1.3s cubic-bezier(.2,.8,.2,1) both; }
@keyframes reveal { from { clip-path: inset(0 0 100% 0); filter: blur(12px); } to { clip-path: inset(0); filter: none; } }
.tips { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.tips span { font-size: 13px; font-weight: 600; background: var(--glass); border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; }

/* Choix de l'occasion */
.options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.opt { position: relative; overflow: hidden; background: var(--glass); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.8); border-radius: 22px; padding: 18px 14px; display: grid; gap: 4px; cursor: pointer; text-align: left;
  box-shadow: 0 8px 22px rgba(29,21,48,.07); opacity: 0; transform: translateY(14px); animation: up .55s cubic-bezier(.2,.8,.2,1) forwards; transition: transform .2s, box-shadow .2s; }
.opt::before { content: ""; position: absolute; width: 90px; height: 90px; border-radius: 50%; right: -30px; top: -30px; background: var(--c); opacity: .35; filter: blur(4px); }
.opt:hover { box-shadow: 0 14px 30px rgba(123,92,255,.2); }
.opt:active { transform: scale(.97); }
.opt .e { font-size: 32px; line-height: 1.1; }
.opt b { font: 800 19px var(--display); }
.opt small { color: var(--muted); font-size: 12.5px; }
@keyframes up { to { opacity: 1; transform: none; } }

/* Analyse IA */
.log { display: grid; gap: 8px; background: rgba(29,21,48,.92); color: #fff; border-radius: 22px; padding: 16px 18px; font-size: 14px; min-height: 120px; box-shadow: 0 18px 40px rgba(29,21,48,.25); }
.log p { margin: 0; position: relative; padding-left: 24px; animation: logline .4s ease both; }
.log p::before { content: "✓"; position: absolute; left: 0; color: var(--mint); font-weight: 800; }
.log p.wait::before { content: "•"; color: var(--peach); animation: blink 1s infinite; }
.log p b { color: var(--peach); font-weight: 700; }
@keyframes logline { from { opacity: 0; transform: translateX(-8px); } }
@keyframes blink { 50% { opacity: .2; } }
.log .choice { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.log .choice button { border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); color: #fff; border-radius: 12px; padding: 8px 12px; cursor: pointer; font-weight: 700; font-size: 13px; }

/* Résultat */
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 6px; border-radius: 18px; background: var(--glass); backdrop-filter: blur(12px); border: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 11px 4px; border-radius: 13px; cursor: pointer; color: var(--muted); font-weight: 800; font-size: 14px; transition: all .3s; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.tabs .ld { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--pink); margin-left: 6px; vertical-align: middle; animation: blink 1s infinite; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { font-size: 12.5px; font-weight: 700; padding: 6px 10px; border-radius: 10px; background: #fff; border: 1px solid var(--line); }
.piece { display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: 14px; align-items: center; background: var(--glass); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.8); border-radius: 22px; padding: 12px; box-shadow: 0 10px 26px rgba(29,21,48,.08); }
.piece .ph { width: 86px; aspect-ratio: 3 / 4; border-radius: 14px; overflow: hidden; background: #fff; }
.piece .ph img { width: 100%; height: 100%; object-fit: cover; }
.piece b { font: 800 18px/1.15 var(--display); display: block; }
.piece .price { font-weight: 800; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; font-variant-numeric: tabular-nums; }
.piece small { color: var(--muted); display: block; font-size: 13px; margin-top: 3px; }
.why { margin: 0; font-size: 14.5px; color: var(--muted); }
.why b { color: var(--ink); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.note { font-size: 13px; color: var(--muted); text-align: center; margin: 0; }
.credit { font-size: 11px; color: var(--muted); text-align: center; }
.credit a { color: inherit; }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; justify-self: center; font-size: 14px; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; transition: none !important; } .opt { opacity: 1; transform: none; } }
</style>
</head>

// Largeur de la silhouette sur une ligne de l'image (masque de segmentation), autour du centre du corps
function rowWidth(mask, W, H, y, cx) {
  y = Math.max(0, Math.min(H - 1, Math.round(y))); cx = Math.round(cx);
  let l = cx, r = cx; const on = x => mask[y * W + x] > .5;
  if (!on(cx)) return 0;
  while (l > 0 && on(l - 1)) l--; while (r < W - 1 && on(r + 1)) r++;
  return r - l + 1;
}
async function analyse(img) {
  const out = { ok: false };
  try {
    const pl = await loadPose(), res = pl.detect(img), lm = res.landmarks && res.landmarks[0];
    if (lm) {
      out.ok = true; out.lm = lm;
      const W = img.naturalWidth, H = img.naturalHeight, P = i => ({ x: lm[i].x * W, y: lm[i].y * H, v: lm[i].visibility ?? 1 });
      const sL = P(11), sR = P(12), hL = P(23), hR = P(24), aL = P(27), aR = P(28);
      const shY = (sL.y + sR.y) / 2, hpY = (hL.y + hR.y) / 2, cx = (hL.x + hR.x + sL.x + sR.x) / 4, torso = Math.max(1, hpY - shY);
      let S = Math.hypot(sL.x - sR.x, sL.y - sR.y) * 1.18, Wa = 0, Hi = 0;
      try {
        const seg = await loadSeg(), sr = seg.segment(img), mk = sr.categoryMask;
        const raw = mk.getAsUint8Array(), mw = mk.width, mh = mk.height, sx = mw / W, sy = mh / H;
        const body = raw[Math.round((shY + torso * .5) * sy) * mw + Math.round(cx * sx)];   // valeur du masque au centre du corps
        const m = Array.from(raw, v => v === body ? 1 : 0);
        Wa = rowWidth(m, mw, mh, (shY + torso * .62) * sy, cx * sx) / sx;
        Hi = rowWidth(m, mw, mh, (hpY + torso * .08) * sy, cx * sx) / sx;
        if (sr.close) sr.close();
      } catch (_) {}
      if (!Hi) Hi = Math.hypot(hL.x - hR.x, hL.y - hR.y) * 1.9;
      if (!Wa) Wa = (S + Hi) / 2 * .85;
      const big = Math.max(S, Hi);
      out.ratio = S / Hi;
      out.m = Wa / big < .78 && Math.abs(S - Hi) / big < .12 ? 'X' : S > Hi * 1.1 ? 'V' : Hi > S * 1.07 ? 'A' : Wa / big > .97 ? 'O' : 'H';
      const bw = Wa / torso; out.build = bw < .62 ? 'élancée' : bw < .85 ? 'équilibrée' : 'pleine';
      out.legs = (aL.v > .5 || aR.v > .5) ? ((Math.max(aL.y, aR.y) - hpY) / torso > 1.55 ? 'jambes longues' : (Math.max(aL.y, aR.y) - hpY) / torso < 1.3 ? 'buste long' : 'proportions équilibrées') : null;
      out.geo = { shY, hpY, waY: shY + torso * .62, hiY: hpY + torso * .08, cx, S, Wa, Hi, W, H };
    }
  } catch (e) { out.err = String(e); }
  try {
    const fa = await loadFace(), f = await fa.detectSingleFace(img, new fa.TinyFaceDetectorOptions({ inputSize: 416 })).withAgeAndGender();
    console.warn('profil', f ? f.gender + ' ' + f.genderProbability.toFixed(2) : 'aucun visage');
    if (f && f.genderProbability > .7) out.g = f.gender === 'female' ? 'f' : 'h';
  } catch (e) { console.warn('profil erreur', e && e.message); }
  return out;
}

// Dessin animé des points du corps et des mesures, par-dessus la photo (même cadrage que l'image)
const BONES = [[11, 12], [11, 13], [13, 15], [12, 14], [14, 16], [11, 23], [12, 24], [23, 24], [23, 25], [25, 27], [24, 26], [26, 28]];
async function drawScan(cv, img, a) {
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  const c = cv.getContext('2d'); c.scale(dpr, dpr);
  const sc = Math.min(r.width / img.naturalWidth, r.height / img.naturalHeight), ox = (r.width - img.naturalWidth * sc) / 2, oy = (r.height - img.naturalHeight * sc) / 2;
  const X = x => ox + x * sc, Y = y => oy + y * sc, L = i => ({ x: X(a.lm[i].x * img.naturalWidth), y: Y(a.lm[i].y * img.naturalHeight) });
  const pts = [0, 11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28];
  const grad = c.createLinearGradient(0, 0, r.width, r.height); grad.addColorStop(0, '#ff5d8f'); grad.addColorStop(1, '#7b5cff');
  for (let k = 1; k <= 30; k++) {          // les os se dessinent progressivement
    c.clearRect(0, 0, r.width, r.height);
    c.strokeStyle = grad; c.lineWidth = 3; c.lineCap = 'round'; c.shadowColor = 'rgba(123,92,255,.6)'; c.shadowBlur = 10;
    BONES.forEach(([p, q]) => { const A = L(p), B = L(q), t = Math.min(1, k / 30); c.beginPath(); c.moveTo(A.x, A.y); c.lineTo(A.x + (B.x - A.x) * t, A.y + (B.y - A.y) * t); c.stroke(); });
    pts.forEach((i, n) => { if (n / pts.length > k / 30) return; const P = L(i); c.beginPath(); c.fillStyle = '#fff'; c.arc(P.x, P.y, 5, 0, 7); c.fill(); c.lineWidth = 2; c.stroke(); });
    await wait(28);
  }
  return { c, X, Y, r, grad };
}
async function drawMeasure(ctx, a, label, y, w, color) {
  const { c, X, Y } = ctx, g = a.geo, yy = Y(y), x1 = X(g.cx - w / 2), x2 = X(g.cx + w / 2);
  for (let k = 1; k <= 14; k++) {
    const t = k / 14, m = (x1 + x2) / 2;
    c.save(); c.shadowBlur = 0; c.strokeStyle = color; c.lineWidth = 2; c.setLineDash([5, 4]);
    c.beginPath(); c.moveTo(m - (m - x1) * t, yy); c.lineTo(m + (x2 - m) * t, yy); c.stroke(); c.restore();
    await wait(20);
  }
  c.save(); c.font = '800 12px "Plus Jakarta Sans", sans-serif'; const tw = c.measureText(label).width + 14;
  c.fillStyle = color; c.beginPath(); c.roundRect(x2 + 6, yy - 11, tw, 22, 8); c.fill(); c.fillStyle = '#fff'; c.fillText(label, x2 + 13, yy + 4); c.restore();
}

function shrink(file) {
  const raw = () => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => res(null); r.readAsDataURL(file); });
  return new Promise(res => {
    const im = new Image(), url = URL.createObjectURL(file), done = v => { clearTimeout(to); URL.revokeObjectURL(url); res(v); };
    const to = setTimeout(() => raw().then(done), 8000);
    im.onload = () => { try {
      const sc = Math.min(1, 1024 / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement('canvas');
      c.width = Math.round(im.naturalWidth * sc); c.height = Math.round(im.naturalHeight * sc); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      done(c.toDataURL('image/jpeg', .88)); } catch (_) { raw().then(done); } };
    im.onerror = () => raw().then(done); im.src = url;

        <span class="float a">✨ Analyse de silhouette</span><span class="float b">👗 3 looks pour toi</span><span class="float c">🪞 Sur ta propre photo</span></div>
      <button class="cta" type="button" data-go="1">Commencer <span>→</span></button>
      <div class="marquee" aria-hidden="true"><div>${Array(2).fill('Soirée <b>✦</b> Mariage <b>✦</b> Travail <b>✦</b> Rendez-vous <b>✦</b> Sport <b>✦</b> Week-end <b>✦</b>').join(' ')}</div></div>
      <div class="how"><div><span>📸</span>Ta photo</div><div><span>🧠</span>L'IA t'analyse</div><div><span>🪄</span>Tu te vois habillé·e</div></div>
    </section>`,
  () => `<section class="screen">
      <h2>D'abord, <span class="hl">ta photo</span></h2>
      <p class="sub">Elle sert seulement à t'analyser et t'habiller.</p>
      <label for="photo" tabindex="0" style="cursor:pointer;display:block">${state.photo ? frame(state.photo) : `<div class="frame"><div class="empty"><span class="plus">+</span><b>Ajoute ta photo</b>Touche ici pour choisir une photo</div></div>`}</label>
      <div class="tips"><span>🧍 En entier</span><span>👀 De face</span><span>💡 Bien éclairée</span></div>
      <button class="cta" type="button" data-go="2" ${state.photo ? '' : 'disabled'}>Continuer <span>→</span></button>
      ${state.photo ? `<label class="link" for="photo" tabindex="0">Changer de photo</label>` : ''}
    </section>`,
  () => `<section class="screen"><h2>Pour quelle <span class="hl">occasion</span> ?</h2>
      <div class="options">${Object.entries(OCCS).map(([k, [e, t, d, col]], i) => `<button class="opt" type="button" data-occ="${k}" style="--c:${col};animation-delay:${i * 60}ms"><span class="e">${e}</span><b>${t}</b><small>${d}</small></button>`).join('')}</div></section>`,
  () => `<section class="screen">
      <h2>L'IA <span class="hl">t'analyse</span></h2>
      <div class="frame scan" id="sframe"><div class="blur" style="background-image:url('${state.photo}')"></div><img src="${state.photo}" alt="Ta photo" id="simg"><canvas id="cv"></canvas></div>
      <div class="log" id="log"><p class="wait">Lecture de ta photo…</p></div>
    </section>`,
  () => {
    const L = looks(), l = L[state.pick], t = tries[tkey(l)] || {};
    const src = t.st === 'ok' ? t.url : state.photo;
    return `<section class="screen">
      <h2>Tes 3 <span class="hl">looks</span></h2>
      <div class="chips">${state.info.map(x => `<span>${x}</span>`).join('')}</div>
      <div class="tabs">${L.map((x, i) => { const s = tries[tkey(x)] || {}; return `<button type="button" data-pick="${i}" aria-pressed="${i === state.pick}">Look ${i + 1}${s.st === 'run' ? '<span class="ld"></span>' : ''}</button>`; }).join('')}</div>
      <div class="frame ${t.st === 'run' ? 'scan' : ''}"><div class="blur" style="background-image:url('${src}')"></div><img src="${src}" alt="${t.st === 'ok' ? 'Toi avec ' + l.n : 'Ta photo'}" class="${t.st === 'ok' ? 'reveal' : ''}">
        <span class="badge">${t.st === 'run' ? '🪄 L\'IA t\'habille…' : t.st === 'ok' ? `✨ Toi · Look ${state.pick + 1}` : t.st === 'err' ? 'Essayage impossible' : ''}</span></div>
      ${t.st === 'err' ? `<p class="note">Ça n'a pas marché (${t.why}). <button class="link" type="button" data-retry>Réessayer</button></p>` : ''}
      <p class="why"><b>${l.fit ? 'Idéal pour ta silhouette.' : 'Va bien avec ta silhouette.'}</b> ${MORPHS[state.m].t}</p>
      <div class="piece"><div class="ph"><img src="${pic(l, 300)}" alt="${l.n}"></div><div><b>${l.n}</b><span class="price">≈ ${l.p} €</span><small>À porter avec : ${l.a}</small></div></div>
      <div class="row"><label class="ghost" for="photo" tabindex="0">Autre photo</label>
        <a class="cta" href="https://www.vinted.fr/catalog?search_text=${encodeURIComponent(l.n)}" target="_blank" rel="noopener">Sur Vinted</a></div>
      <span class="credit">${credit(l)}</span>
      <button class="link" type="button" data-restart>Changer d'occasion</button>
    </section>`;
  }
];

function render(soft) {
  const y = scrollY;
  $('#app').innerHTML = S[state.step]();
  if (soft) { const sc = $('#app .screen'); if (sc) sc.style.animation = 'none'; scrollTo(0, y); } else scrollTo(0, 0);
  $('#back').hidden = state.step === 0 || state.step === 3;
}

/* Analyse animée, puis lancement des essayages */
let waitingTry = false;
function say(html, cls = '') { const p = document.createElement('p'); p.className = cls; p.innerHTML = html; $('#log').appendChild(p); return p; }
async function runAnalysis() {
  const log = $('#log'), img = await imgOf(state.photo);
  await new Promise(r => $('#simg').complete ? r() : $('#simg').onload = r);
  const a = await analyse(img);
  if (state.step !== 3) return;
  log.innerHTML = '';
  if (!a.ok) {
    say('Je ne vois pas bien ta silhouette. Pas grave, dis-moi :');
    return askManual(a.g);
  }
  $('#sframe').classList.remove('scan');
  const ctx = await drawScan($('#cv'), img, a);
  say('Silhouette détectée'); await wait(450);
  await drawMeasure(ctx, a, 'Épaules', a.geo.shY + (a.geo.hpY - a.geo.shY) * .06, a.geo.S, '#7b5cff');
  await drawMeasure(ctx, a, 'Taille', a.geo.waY, a.geo.Wa, '#ff5d8f');
  await drawMeasure(ctx, a, 'Hanches', a.geo.hiY, a.geo.Hi, '#ff8a5c');
  say(`Épaules / hanches : <b>${a.ratio.toFixed(2).replace('.', ',')}</b>`); await wait(500);
  say(`Silhouette : <b>${MORPHS[a.m].n}</b>, ${MORPHS[a.m].d}`); await wait(600);
  say(`Allure : <b>${a.build}</b>${a.legs ? ` · ${a.legs}` : ''}`); await wait(600);
  state.m = a.m; state.info = [MORPHS[a.m].n, 'Allure ' + a.build, ...(a.legs ? [a.legs] : [])];
  if (!a.g) return askGender();
  say(`Profil : <b>${a.g === 'f' ? 'Femme' : 'Homme'}</b> <button class="link" type="button" data-fix style="color:#bbb;font-size:12px">corriger</button>`);
  state.g = a.g; await wait(500); startTries();
}
function askGender() {
  const p = say('Ce look est pour… <span class="choice"><button type="button" data-gender="f">Femme</button><button type="button" data-gender="h">Homme</button></span>', 'wait');
  p.dataset.ask = 1;
}
function askManual(g) {
  say(`<span class="choice">${Object.entries(MORPHS).map(([k, v]) => `<button type="button" data-morph="${k}">${v.n}</button>`).join('')}</span>`, 'wait');
  state.g = g || null;
}
function startTries() {
  const L = looks();
  say(`3 pièces choisies : <b>${L.map(x => x.n).join(', ')}</b>`);
  say('Essayage sur ta photo… (environ 15 s)', 'wait');
  waitingTry = true; tryOn(L[0]); setTimeout(() => { tryOn(L[1]); tryOn(L[2]); }, 1500);
}
function onTryDone() {
  if (!waitingTry) return;
  const st = looks().map(x => (tries[tkey(x)] || {}).st);
  if (st.includes('ok') || !st.includes('run')) { waitingTry = false; state.step = 4; state.pick = Math.max(0, st.indexOf('ok')); render(); }
}

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id === 'back') { state.step = state.step === 4 ? 2 : Math.max(0, state.step - 1); }
  else if (t.dataset.go) { state.step = +t.dataset.go; if (state.step === 2) { loadPose().catch(() => {}); loadSeg().catch(() => {}); loadFace().catch(() => {}); } }
  else if (t.dataset.occ) { state.o = t.dataset.occ; state.step = 3; render(); runAnalysis(); return; }
  else if (t.dataset.gender) { state.g = t.dataset.gender; t.closest('p').remove(); say(`Profil : <b>${state.g === 'f' ? 'Femme' : 'Homme'}</b>`); if (!state.m) state.m = 'H'; startTries(); return; }
  else if (t.dataset.morph) { state.m = t.dataset.morph; state.info = [MORPHS[state.m].n]; t.closest('p').remove(); say(`Silhouette : <b>${MORPHS[state.m].n}</b>`); if (state.g) { say(`Profil : <b>${state.g === 'f' ? 'Femme' : 'Homme'}</b>`); startTries(); } else askGender(); return; }
  else if ('fix' in t.dataset) { state.g = state.g === 'f' ? 'h' : 'f'; for (const k in tries) delete tries[k]; waitingTry = false; t.closest('p').innerHTML = `Profil : <b>${state.g === 'f' ? 'Femme' : 'Homme'}</b>`; startTries(); return; }
  else if (t.dataset.pick) { state.pick = +t.dataset.pick; render(true); return; }
  else if ('retry' in t.dataset) { tryOn(looks()[state.pick]); render(true); return; }
  else if ('restart' in t.dataset) { state.step = 2; }
  else return;
  render();
});
document.addEventListener('keydown', e => { if (e.target.matches('label[for=photo]') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); $('#photo').click(); } });
$('#photo').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  shrink(f).then(d => { e.target.value = ''; if (!d) return;
    state.photo = d; state.g = state.m = null; for (const k in tries) delete tries[k];
    loadPose().catch(() => {}); loadSeg().catch(() => {}); loadFace().catch(() => {});
    if (state.step === 4) { state.step = 3; render(); runAnalysis(); } else render(); });
});
render();
</script>
</body>
</html>
