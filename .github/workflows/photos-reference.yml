name: Photos de référence
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/photos-reference.yml', 'outils/photos_reference.py']
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger les photos (Wikimedia Commons)
        run: python3 outils/photos_reference.py /tmp/references
      - name: Enregistrer sur la branche « references » (hors du site)
        run: |
          cd /tmp/references
          git init -q -b references && git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "Photos de référence (Wikimedia Commons)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" references
