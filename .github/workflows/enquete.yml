name: Enquête données 3D 
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - name: Verifier les noms de domaine libres
        run: |
          set +e
          mkdir -p /tmp/e && cd /tmp/e
          echo dresli dresmo dresoka dresu dresy dresya dreszo drexi drezo fitie fitiva fitlo fitmo fitoka fitora fitvia fitx fitya fyto kabiva kabu kabya lookie lookiva lookmo lookra lookuu lookvo lookx lookya lookza lukaa lukeo lukiva lukmo lukoa luku lukya lukzo luvio luxie miravo miraya mirazo mirlo mirmo miroka mirqa miru miry mirya modexa modiva outfa outfy outvo outza stylaa stylix stylo styloka stylq stylvo styly stylya stylza stymo styu trenza tryie trylo trymo tryo tryoka tryvia tryvio tryx tryya tryza velu velura vestia vestiq vestlo vesto vestoka vestx vestya vesu weari wearie wearka wearlo wearmo wearo wearvia wearx wearya wearzy wero | tr ' ' '\n' | xargs -P 12 -I{} sh -c 'c=$(curl -s -o /dev/null -w "%{http_code}" -m 15 "https://rdap.verisign.com/com/v1/domain/{}.com"); echo "{} com=$c"' > journal.txt
          sort journal.txt -o journal.txt; cat journal.txt
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
