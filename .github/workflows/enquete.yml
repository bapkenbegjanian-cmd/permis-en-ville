name: Enquête données 3D 
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - name: Audit complet de Lookmiz
        timeout-minutes: 14
        run: |
          set +e
          mkdir -p /tmp/e /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null 2>&1; npm i playwright@1.47.2 >/dev/null 2>&1; npx playwright install --with-deps chromium >/dev/null 2>&1
          curl -sL -o moi.jpg 'https://images.unsplash.com/photo-1715541448446-3369e1cc0ee9?ixid=M3wxMTE2NDI3fDB8MXxzZWFyY2h8NHx8ZmFzaGlvbiUyMG1vZGVsJTIwZnVsbCUyMGJvZHl8ZW58MXwxfHx8MTc5MzIxNDcyNHww&ixlib=rb-4.1.0&w=900&q=85&fm=jpg'; curl -sL -o habit.jpg 'https://images.unsplash.com/photo-1772571157276-a76fa80f2a1a?ixid=M3wxMTE2NDI3fDB8MXxzZWFyY2h8N3x8cmVkJTIwZHJlc3MlMjBoYW5nZXJ8ZW58MXx8fHwxNzkzMjE4MDg1fDA&ixlib=rb-4.1.0&w=900&q=85&fm=jpg'
          cat > t.js <<'JS'
          const { chromium, devices } = require('playwright');
          const URL = 'http://lookmiz.com/?v=' + Date.now();
          (async () => {
            const b = await chromium.launch();
            for (const [dev, opts] of [['m', devices['iPhone 13']], ['d', { viewport: { width: 1440, height: 900 } }]]) {
              const ctx = await b.newContext(opts); ctx.setDefaultTimeout(15000);
              const p = await ctx.newPage(); const errs = []; p.on('pageerror', e => errs.push(e.message));
              let n = 0; const snap = async name => { await p.waitForTimeout(1500); await p.screenshot({ path: `/tmp/e/${dev}${String(++n).padStart(2, '0')}-${name}.png`, fullPage: true });
                const info = await p.evaluate(() => ({ wide: document.documentElement.scrollWidth > innerWidth, back: !document.querySelector('#back').hidden }));
                console.log(dev, n, name, JSON.stringify(info)); };
              const step = async (name, f) => { try { await f(); await snap(name); } catch (e) { console.log(dev, 'ECHEC', name, e.message.split('\n')[0]); } };
              await p.goto(URL); await p.waitForTimeout(2500); await snap('accueil');
              await step('magasin', () => p.click('.tabbar [data-tab="shop"]'));
              await step('cabineplus', () => p.click('[data-plus]'));
              await step('retour', async () => { await p.click('#back'); await p.click('.tabbar [data-tab="look"]'); });
              await step('inscription', () => p.click('[data-start="look"]'));
              if (dev === 'm') {
                await step('connexion', () => p.click('[data-switch]'));
                await step('apres-inscription', async () => { await p.click('[data-switch]'); await p.fill('#email', 'audit.lookmiz.' + Date.now() + '@gmail.com'); await p.fill('#pass', 'Audit-' + Date.now()); await p.click('#login .cta'); await p.waitForTimeout(3000); });
                await step('photo', () => p.setInputFiles('#photo', 'moi.jpg'));
                await step('occasion', () => p.click('[data-go="2"]'));
                await step('analyse', async () => { await p.click('[data-occ="travail"]'); await p.waitForTimeout(8000); });
                await step('looks1', async () => { await p.waitForSelector('.tabs', { timeout: 150000 }); await p.waitForTimeout(30000); });
                await step('looks2', () => p.click('[data-pick="1"]'));
                await step('looks3', () => p.click('[data-pick="2"]'));
                await step('magasin-connecte', () => p.click('.tabbar [data-tab="shop"]'));
                await step('habit', () => p.click('[data-start="shop"]'));
                await step('habit-choisi', () => p.setInputFiles('#garment2', 'habit.jpg'));
                await step('magasin-resultat', async () => { await p.click('[data-shoptry]'); await p.waitForFunction(() => !document.querySelector('.frame.scan'), null, { timeout: 120000 }); });
                await step('cabineplus-connecte', () => p.click('[data-plus]'));
              }
              console.log(dev, 'erreurs', errs);
            }
            await b.close();
          })().catch(e => console.log('ECHEC global', e.message));
          JS
          timeout 700 node t.js > /tmp/e/journal.txt 2>&1; cat /tmp/e/journal.txt
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
