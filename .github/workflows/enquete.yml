name: Enquête données 3D 
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Test paiement Lookmiz
        run: |
          set +e
          mkdir -p /tmp/e && cd /tmp/e
          { curl -s "https://api-adresse.data.gouv.fr/search/?limit=2&autocomplete=1&q=10+place+bellecour" | head -c 400; echo
            curl -s -D - "https://data.geopf.fr/navigation/itineraire?resource=bdtopo-osrm&profile=car&optimization=fastest&start=4.832,45.757&end=5.0811,45.7234&distanceUnit=kilometer&getSteps=false" -H "Origin: https://vtcba.com" | grep -iE "access-control|distance|HTTP/" | head -c 600; echo; } > journal.txt 2>&1
          npm i -s playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
          cat > t.js <<'JS'
          const {chromium,devices}=require('playwright');(async()=>{const b=await chromium.launch();const p=await b.newPage({...devices['iPhone 13']});const L=[];p.on('pageerror',x=>L.push('ERR '+x.message));p.on('console',m=>{if(m.type()==='error')L.push('C '+m.text())});
          await new Promise(r=>setTimeout(r,70000));
          await p.goto('https://vtcba.com/?v='+Date.now()+'#devis',{waitUntil:'networkidle'});await p.waitForTimeout(1000);
          await p.fill('#dep','10 place Bellecour');await p.waitForTimeout(2500);L.push('sug dep: '+await p.locator('.sug li').first().innerText().catch(()=>'aucune'));await p.locator('.sug li').first().dispatchEvent('mousedown');
          await p.fill('#arr','aeroport saint exupery');await p.waitForTimeout(2500);L.push('sug arr: '+await p.locator('.sug:visible li').first().innerText().catch(()=>'aucune'));await p.locator('.sug:visible li').first().dispatchEvent('mousedown');
          await p.waitForTimeout(3000);L.push('prix aeroport: '+await p.locator('#price').innerText());
          await p.fill('#arr','Gare Part-Dieu Lyon');await p.waitForTimeout(2500);await p.locator('.sug:visible li').first().dispatchEvent('mousedown');await p.waitForTimeout(3000);L.push('prix part-dieu: '+await p.locator('#price').innerText());
          await p.fill('[name=heure]','23:30');await p.dispatchEvent('[name=heure]','change');await p.waitForTimeout(3000);L.push('prix nuit: '+await p.locator('#price').innerText());
          await p.fill('#arr','Annecy');await p.waitForTimeout(2500);await p.locator('.sug:visible li').first().dispatchEvent('mousedown');await p.fill('[name=heure]','14:00');await p.dispatchEvent('[name=heure]','change');await p.waitForTimeout(3500);L.push('prix annecy: '+await p.locator('#price').innerText());
          await p.locator('#price').scrollIntoViewIfNeeded();await p.screenshot({path:'calc.png'});
          require('fs').appendFileSync('journal.txt',L.join('\n'));await b.close()})()
          JS
          node t.js >> journal.txt 2>&1; rm -rf node_modules package*.json t.js
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
