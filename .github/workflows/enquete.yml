name: Enquête données 3D 
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - name: Verifier les noms de domaine libres
        run: |
          set +e
          mkdir -p /tmp/e && cd /tmp/e
          for n in habilo vestora tryloo essayly cabinoo lookfit modyz cintra essayo mirora vestio fitzo cabino lookora tenuo habilly essaya vestyl lookzy trylook stylmi lookami miroa dressly fitmi tenua habiz lookio essayz mirly styloo lookeo cabinea vestimo tryzy outfiz lookyz habilia dresso; do
            c=$(curl -s -o /dev/null -w "%{http_code}" -m 15 "https://rdap.verisign.com/com/v1/domain/$n.com")
            f=$(curl -s -o /dev/null -w "%{http_code}" -m 15 "https://rdap.nic.fr/domain/$n.fr")
            echo "$n com=$c fr=$f" >> journal.txt
          done
          cat journal.txt
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
