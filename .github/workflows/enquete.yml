name: Enquête données 3D 
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Test paiement Lookmiz
        run: |
          set +e
          mkdir -p /tmp/e && cd /tmp/e
          cat > q.py <<'PY'
          import json, urllib.request
          def gql(url, q):
              r = urllib.request.Request(url, data=json.dumps({'query': q}).encode(), headers={'Content-Type': 'application/json', 'User-Agent': 'Mozilla/5.0'})
              try: return urllib.request.urlopen(r, timeout=30).read().decode()[:1500]
              except Exception as e: return 'ERR ' + str(e) + ' ' + (e.read().decode()[:800] if hasattr(e, 'read') else '')
          for url in ['https://graphql.lottiefiles.com/2022-08', 'https://graphql.lottiefiles.com/', 'https://graphql.lottiefiles.com/2022-08/graphql']:
              print(url); print(gql(url, '{ searchPublicAnimations(query: "wedding", first: 2) { edges { node { id name url gifUrl lottieUrl jsonUrl imageUrl } } } }')); print()
          try:
              h = urllib.request.urlopen(urllib.request.Request('https://lottiefiles.com/search?q=wedding&category=animations', headers={'User-Agent': 'Mozilla/5.0'}), timeout=30).read().decode()
              import re; print('html', len(h)); print(sorted(set(re.findall(r'https://[a-z0-9.-]*lottiefiles\.com/[^"\\ ]+\.(?:json|lottie|gif|png)', h)))[:15])
          except Exception as e: print('html ERR', e)
          PY
          python3 q.py > journal.txt 2>&1
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
