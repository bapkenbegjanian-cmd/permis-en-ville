name: Enquête données 3D 
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Test paiement Lookmiz
        run: |
          set +e
          mkdir -p /tmp/e && cd /tmp/e
          wget -q --mirror --page-requisites --no-parent -e robots=off --restrict-file-names=nocontrol -U "Mozilla/5.0 (staralyn-sauvegarde)" https://www.staralyn.com/ https://www.staralyn.com/fr/ https://www.staralyn.com/en/ https://www.staralyn.com/sitemap.xml https://www.staralyn.com/robots.txt https://www.staralyn.com/ads.txt https://www.staralyn.com/_headers https://www.staralyn.com/_redirects 2>/dev/null
          for u in $(grep -oE "<loc>[^<]+" www.staralyn.com/sitemap.xml 2>/dev/null | sed 's/<loc>//' | head -2000); do wget -q -x -nc --page-requisites -e robots=off "$u" 2>/dev/null; done
          mv www.staralyn.com site 2>/dev/null
          { find site -type f | wc -l; du -sh site; find site -maxdepth 2 | head -40; } > journal.txt
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
