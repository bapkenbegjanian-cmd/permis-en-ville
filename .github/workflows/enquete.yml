name: Enquête données 3D
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - name: Noms de domaine libres
        run: |
          set +e
          mkdir -p /tmp/e && cd /tmp/e
          for d in quisait.com google.com quizdefi.com defiquiz.com quizpotes.com quizpote.com quizflash.com quizclash.com quizrush.com quizboom.com quizzap.com quizoo.com monquiz.com quizchrono.com quizyo.com quizpop.com quizvs.com quizduo.com quizbattle.com quizzou.com quizly.com quizfou.com quizcool.com quizzy.com quizmix.com quizking.com quizgo.com quizup.com quizzz.com quizfast.com quizfriends.com quizdual.com quiztime.com quizblitz.com quizzle.com quizlab.com quizbuzz.com quizsprint.com quizrace.com quizhero.com quizstar.com quizdefis.com quizentrepotes.com quizcash.com quizbox.com quizwave.com quizpulse.com quizkong.com quiztonpote.com; do
            ns=$(dig +short NS $d | head -1); c=$(sleep 2; curl -sS -m 20 -o /dev/null -w "%{http_code}" "https://rdap.verisign.com/com/v1/domain/$d")
            echo "$d rdap=$c ns=$ns"
          done > journal.txt 2>&1
          cat journal.txt
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
