name: Enquête données 3D 
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Test paiement Lookmiz
        run: |
          set +e
          mkdir -p /tmp/e && cd /tmp/e
          curl -s "https://recherche-entreprises.api.gouv.fr/search?q=94261244100025" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          for r in d.get('results', [])[:3]:
              s = r.get('siege', {})
              print('nom:', r.get('nom_complet')); print('raison sociale:', r.get('nom_raison_sociale')); print('forme:', r.get('nature_juridique')); print('activite:', r.get('activite_principale'))
              print('creation:', r.get('date_creation')); print('etat:', r.get('etat_administratif')); print('siege:', s.get('siret'), s.get('adresse'))
              print('dirigeants:', [ (x.get('prenoms'), x.get('nom'), x.get('qualite')) for x in r.get('dirigeants', [])])
              m = [e for e in r.get('matching_etablissements', [])]; print('etab:', [(e.get('siret'), e.get('adresse')) for e in m])
          print('total', d.get('total_results'))
          " > journal.txt 2>&1
          curl -s -o /dev/null -w "vtcba.com dns: %{http_code}\n" http://vtcba.com >> journal.txt
          dig +short vtcba.com A >> journal.txt; dig +short vtcba.com NS >> journal.txt
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
