name: Enquête données 3D 
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - name: Chercher des photos d'habits seuls (Unsplash) et faire une planche
        env:
          KEY: ${{ secrets.UNSPLASH_KEY }}
        run: |
          set +e
          mkdir -p /tmp/e /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null 2>&1; npm i playwright@1.47.2 >/dev/null 2>&1; npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > get.py <<'PY'
          import json, os, urllib.request, urllib.parse
          Q = ['dress on hanger', 'evening gown hanger', 'red dress hanger', 'black dress hanger', 'satin dress', 'floral dress hanger',
               'blouse on hanger', 'blazer on hanger', 'women suit hanger', 'sportswear flat lay', 'jeans and shirt flat lay', 'summer dress flat lay',
               'men suit on hanger', 'men shirt on hanger', 'men blazer hanger', 'polo shirt', 'hoodie flat lay', 'men outfit flat lay', 'tracksuit']
          out = []
          for q in Q:
              u = 'https://api.unsplash.com/search/photos?per_page=12&content_filter=high&query=' + urllib.parse.quote(q)
              r = json.load(urllib.request.urlopen(urllib.request.Request(u, headers={'Authorization': 'Client-ID ' + os.environ['KEY'], 'Accept-Version': 'v1'}), timeout=30))
              for p in r['results']:
                  out.append({'q': q, 'id': p['id'], 'raw': p['urls']['raw'], 'alt': p.get('alt_description'), 'by': p['user']['name'], 'user': p['user']['links']['html']})
          json.dump(out, open('/tmp/e/habits.json', 'w'), indent=1, ensure_ascii=False)
          h = '<body style="margin:0;font:11px sans-serif;display:grid;grid-template-columns:repeat(8,1fr);gap:4px;width:1600px">' + ''.join(
              f'<div><img src="{p["raw"]}&w=200&h=260&fit=crop&q=60" style="width:100%;display:block"><b>{i}</b></div>' for i, p in enumerate(out))
          open('sheet.html', 'w').write(h); print(len(out))
          PY
          python3 get.py > /tmp/e/journal.txt 2>&1
          cat > t.js <<'JS'
          const { chromium } = require('playwright');
          (async () => { const b = await chromium.launch(); const p = await b.newPage({ viewport: { width: 1600, height: 900 } });
            await p.goto('file:///tmp/pw/sheet.html'); await p.waitForTimeout(15000);
            await p.screenshot({ path: '/tmp/e/sheet.png', fullPage: true });
            await b.close(); })();
          JS
          node t.js >> /tmp/e/journal.txt 2>&1; cat /tmp/e/journal.txt
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
