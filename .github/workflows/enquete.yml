name: Enquête données 3D 
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Test paiement Lookmiz
        run: |
          set +e
          mkdir -p /tmp/e && cd /tmp/e && pip install -q pillow >/dev/null 2>&1
          cat > sk.py <<'PY'
          import json, io, urllib.request, urllib.parse
          from PIL import Image, ImageDraw, ImageFont
          UA = {'User-Agent': 'Mozilla/5.0 lookmiz-preview'}
          def get(u): return urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=30).read()
          Q = [('Maries / figurine', 'wedding couple figurine'), ('Gateau de mariage', 'wedding cake topper'), ('Boite a musique', 'music box ballerina'), ('Enfant / peluche', 'teddy bear'), ('Noel', 'santa claus figurine'), ('Ange / bapteme', 'angel statue'), ('Lanterne orientale', 'arabic lantern'), ('Cigogne / bebe', 'stork baby')]
          F = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 22); f2 = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', 14)
          out = Image.new('RGB', (1860, 300 * len(Q)), 'white'); d = ImageDraw.Draw(out); links = []
          for r, (lab, q) in enumerate(Q):
              u = 'https://api.sketchfab.com/v3/search?' + urllib.parse.urlencode({'type': 'models', 'q': q, 'downloadable': 'true', 'sort_by': '-likeCount', 'count': 24})
              try: res = json.loads(get(u))['results']
              except Exception as e: print('ERR', q, e); continue
              d.text((10, r * 300 + 6), lab, fill='black', font=F); x = 10; n = 0
              for m in res:
                  lic = m.get('license'); lic = lic.get('label') if isinstance(lic, dict) else lic
                  if not lic or 'NonCommercial' in str(lic) or 'NoDerivs' in str(lic): continue
                  th = sorted(m['thumbnails']['images'], key=lambda i: abs(i['width'] - 400))[0]['url']
                  try: im = Image.open(io.BytesIO(get(th))).convert('RGB')
                  except Exception: continue
                  im.thumbnail((300, 220)); out.paste(im, (x, r * 300 + 36)); code = chr(65 + r) + str(n + 1)
                  d.text((x, r * 300 + 262), (code + '. ' + m['name'])[:34], fill='black', font=f2)
                  links.append(f"{code} | {m['name']} | https://sketchfab.com/3d-models/{m['uid']} | {lic} | anim={m.get('animationCount')} | faces={m.get('faceCount')}")
                  x += 308; n += 1
                  if n == 6: break
          out.save('sketchfab.png'); open('liens.txt', 'w').write('\n'.join(links))
          PY
          python3 sk.py > journal.txt 2>&1
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
