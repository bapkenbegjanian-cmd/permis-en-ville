name: Enquête données 3D 
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - name: Test paiement Lookmiz
        run: |
          set +e
          mkdir -p /tmp/e/assets /tmp/w && cd /tmp/w
          npm i -s @gltf-transform/cli@4.1.1 >/dev/null 2>&1
          cat > dl.py <<'PY'
          import json, os, sys, urllib.request
          def get(u): return urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'lookmiz-asset-fetch'})).read()
          ids = sys.argv[1].split(',')
          for i in ids:
              try:
                  f = json.loads(get('https://api.polyhaven.com/files/' + i))
                  g = f['gltf']['1k']['gltf']; d = 'src/' + i; os.makedirs(d, exist_ok=True)
                  open(d + '/m.gltf', 'wb').write(get(g['url']))
                  for path, inc in g.get('include', {}).items():
                      os.makedirs(os.path.dirname(d + '/' + path), exist_ok=True); open(d + '/' + path, 'wb').write(get(inc['url']))
                  print('ok', i)
              except Exception as e: print('ERR', i, e)
          PY
          python3 dl.py treasure_chest,carved_wooden_elephant,wooden_lantern_01,lantern_chandelier_01,ceramic_vase_02,potted_plant_01,vintage_suitcase,alarm_clock_01,Ukulele_01,boombox,antique_ceramic_vase_01,brass_vase_01,lion_head,seadogs_compass,wooden_bowl_01,food_apple_01,food_lime_01,lemon,wicker_basket_02,throw_pillows_01,decorative_book_set_01,postcard_set_01,magnifying_glass_01,vintage_pocket_watch,fancy_picture_frame_01,ceramic_pot,chinese_chandelier,jug_01,brass_pan_01,pine_sapling_small,vintage_telephone_wall_clock,gaming_console,marble_bust_01,horse_head > /tmp/e/journal.txt 2>&1
          for d in src/*; do n=$(basename $d); npx gltf-transform optimize $d/m.gltf /tmp/e/assets/$n.glb --texture-compress webp --texture-size 512 --compress false --join false --flatten false >> /tmp/e/journal.txt 2>&1 || echo "ERR opt $n" >> /tmp/e/journal.txt; done
          ls -la /tmp/e/assets >> /tmp/e/journal.txt
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
