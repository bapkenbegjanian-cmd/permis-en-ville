name: Enquête données 3D 
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - name: Test paiement Lookmiz
        run: |
          set +e
          mkdir -p /tmp/e && cd /tmp/e
          curl -sL https://polyhaven.com/license | python3 -c "import sys,re,html;t=sys.stdin.read();t=re.sub(r'<script.*?</script>|<style.*?</style>','',t,flags=re.S);t=re.sub(r'<[^>]+>',' ',t);print(re.sub(r'\s+',' ',html.unescape(t))[:3500])" > licence.txt
          curl -sL "https://api.polyhaven.com/assets?t=models" | python3 -c "import sys,json;d=json.load(sys.stdin);print(len(d));[print(k,'|',v.get('name'),'|',','.join(v.get('categories',[])),'|',','.join(v.get('tags',[]))[:120]) for k,v in sorted(d.items())]" > modeles.txt
          curl -sL "https://api.polyhaven.com/assets?t=hdris&c=studio" | python3 -c "import sys,json;d=json.load(sys.stdin);print(len(d));[print(k,'|',v.get('name')) for k,v in sorted(d.items())]" > hdris.txt
          echo ok > journal.txt
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
