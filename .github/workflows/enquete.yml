name: Enquête données 3D  
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnostic Trouver mon look
        timeout-minutes: 9
        run: |
          set +e
          mkdir -p /tmp/e /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null 2>&1; npm i playwright@1.47.2 >/dev/null 2>&1; npx playwright install --with-deps chromium >/dev/null 2>&1
          curl -sL -o moi.jpg 'https://images.unsplash.com/photo-1715541448446-3369e1cc0ee9?ixid=M3wxMTE2NDI3fDB8MXxzZWFyY2h8NHx8ZmFzaGlvbiUyMG1vZGVsJTIwZnVsbCUyMGJvZHl8ZW58MXwxfHx8MTc5MzIxNDcyNHww&ixlib=rb-4.1.0&w=900&q=85&fm=jpg'
          cat > t.js <<'JS'
          const { chromium, devices } = require('playwright');
          (async () => { const b = await chromium.launch(); const ctx = await b.newContext(devices['iPhone 13']); ctx.setDefaultTimeout(20000);
            const p = await ctx.newPage(); const t0 = Date.now(), T = () => ((Date.now() - t0) / 1000).toFixed(1);
            p.on('pageerror', e => console.log(T(), 'ERREUR', e.message));
            p.on('console', m => { if (m.type() === 'error' || m.type() === 'warning') console.log(T(), 'console', m.text().slice(0, 160)); });
            p.on('response', async r => { if (r.url().includes('/functions/v1/')) { let body = ''; try { body = (await r.text()).slice(0, 220); } catch (_) {}
              const req = r.request().postData() || ''; console.log(T(), 'FONCTION', r.status(), req.slice(0, 60).replace(/data:image[^"]+/, 'data:…'), '=>', body); } });
            await p.goto('http://lookmiz.com/?v=' + Date.now()); await p.waitForTimeout(2500);
            await p.click('[data-start="look"]'); await p.fill('#email', 'diag.' + Date.now() + '@gmail.com'); await p.fill('#pass', 'Diag-' + Date.now()); await p.click('#login .cta');
            await p.waitForTimeout(3000); console.log(T(), 'ecran', await p.textContent('h2').catch(() => '?'));
            await p.setInputFiles('#photo', 'moi.jpg'); await p.waitForTimeout(1500); await p.click('[data-go="2"]'); await p.waitForTimeout(800);
            await p.click('[data-occ="soiree"]');
            for (let i = 0; i < 24; i++) { await p.waitForTimeout(5000); const h = await p.textContent('h2').catch(() => '?'); const log = await p.textContent('#log').catch(() => '');
              console.log(T(), 'ETAT', h, '|', (log || '').slice(-140)); if (/looks|Passe/i.test(h)) break; }
            console.log(T(), 'badge', await p.textContent('.badge').catch(() => '-'));
            await p.screenshot({ path: '/tmp/e/diag.png', fullPage: true }); await b.close(); })().catch(e => console.log('ECHEC', e.message));
          JS
          timeout 500 node t.js > /tmp/e/journal.txt 2>&1; cat /tmp/e/journal.txt
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
