name: Enquête données 3D  
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - name: Captures des cartes Lookmiz
        timeout-minutes: 8
        run: |
          set +e
          mkdir -p /tmp/e /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null 2>&1; npm i playwright@1.47.2 >/dev/null 2>&1; npx playwright install --with-deps chromium >/dev/null 2>&1
          sleep 70
          cat > t.js <<'JS'
          const { chromium, devices } = require('playwright');
          (async () => { const b = await chromium.launch(); const p = await (await b.newContext(devices['iPhone 13'])).newPage(); const e = []; p.on('pageerror', x => e.push(x.message));
            const U = 'http://lookmiz.com/?v=' + Date.now();
            for (const o of ['mariage']) { await p.goto(U + '#o-' + o); await p.waitForTimeout(6000); await p.screenshot({ path: `/tmp/e/g-${o}.png`, fullPage: true }); }
            await p.goto(U + '#m-anniversaire-1'); await p.waitForTimeout(5000); await p.screenshot({ path: '/tmp/e/ed.png' });
            await p.click('[data-preview]', { force: true }); await p.waitForTimeout(1500); await p.screenshot({ path: '/tmp/e/env.png' });
            await p.click('#env'); await p.waitForTimeout(4500); await p.screenshot({ path: '/tmp/e/open.png', fullPage: true });
            await p.goto(U); await p.waitForTimeout(6000); await p.screenshot({ path: '/tmp/e/home.png', fullPage: true }); await p.goto(U + '#cat-inv'); await p.waitForTimeout(5000); await p.screenshot({ path: '/tmp/e/cat.png', fullPage: true });
            console.log('erreurs', e); await b.close(); })();
          JS
          node t.js > /tmp/e/journal.txt 2>&1; cat /tmp/e/journal.txt
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
