name: Enquête données 3D 
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - name: Tester quels sites de vetements acceptent la lecture des liens
        run: |
          set +e
          mkdir -p /tmp/e && cd /tmp/e
          UA='Mozilla/5.0 (compatible; CabineBot/1.0; aperçu de lien)'
          for u in https://www.zara.com/fr/ https://www.vinted.fr/ https://fr.shein.com/ https://www.asos.com/fr/ https://www2.hm.com/fr_fr/index.html https://www.zalando.fr/ https://www.kiabi.com/ https://www.decathlon.fr/ https://www.nike.com/fr/ https://www.amazon.fr/ https://www.uniqlo.com/fr/fr/ https://www.bershka.com/fr/ https://www.mango.com/fr https://www.laredoute.fr/ https://www.celio.com/ https://www.jules.com/fr-fr/ https://www.galerieslafayette.com/ https://www.lacoste.com/fr/ https://www.adidas.fr/ https://www.primark.com/fr-fr ; do
            code=$(curl -s -m 12 -L -A "$UA" -o p.html -w "%{http_code}" "$u"); og=$(grep -io '<meta[^>]*og:image[^>]*>' p.html | head -1 | cut -c1-70)
            echo "$code $u ${og:+OG}" >> journal.txt
          done
          cat journal.txt
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
