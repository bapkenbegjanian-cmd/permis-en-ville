name: Enquête données 3D 
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Test paiement Lookmiz
        run: |
          set +e
          mkdir -p /tmp/e && cd /tmp/e
          sleep 100
          for u in js/common.js data/ecrans-free.js data/ecrans-full.js data/meta.js supabase/copier-paiement.html; do echo "$u -> $(curl -s -o /tmp/x -w '%{http_code}' https://lookmiz.com/$u?x=$RANDOM) $(wc -c < /tmp/x) octets"; done > journal.txt
          curl -s https://lookmiz.com/js/common.js?x=$RANDOM | grep -c "c-ret" >> journal.txt
          curl -s https://lookmiz.com/programmes/ecrans/?x=$RANDOM | grep -o "3 jours gratuits\|Commencer gratuitement\|rétractation" | sort | uniq -c >> journal.txt
          curl -s https://lookmiz.com/supabase/copier-paiement.html?x=$RANDOM | grep -o "prog_day" | head -1 >> journal.txt
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
