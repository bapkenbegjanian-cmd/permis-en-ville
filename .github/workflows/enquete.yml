name: Enquête données 3D
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer des photos mode libres de droits (Unsplash)
        run: |
          set +e
          mkdir -p /tmp/e/photos && cd /tmp/e/photos
          cat > get.py <<'PY'
          import json, urllib.request, urllib.parse
          Q = {'hero': 'fashion editorial woman', 'soiree': 'evening dress fashion', 'rdv': 'date night outfit', 'travail': 'office outfit fashion',
               'mariage': 'wedding guest outfit', 'sport': 'sportswear fashion', 'casual': 'streetwear fashion', 'homme': 'men fashion suit',
               'hommecasual': 'men streetwear fashion', 'studio': 'full body fashion model studio'}
          meta = {}
          H = {'User-Agent': 'Mozilla/5.0', 'Accept': 'application/json'}
          for k, q in Q.items():
              try:
                  u = 'https://unsplash.com/napi/search/photos?per_page=20&orientation=portrait&query=' + urllib.parse.quote(q)
                  r = json.load(urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=30))
                  n = 0
                  for ph in r.get('results', []):
                      if ph.get('premium') or ph.get('plus'): continue
                      raw = ph['urls']['raw'] + '&w=640&h=900&fit=crop&q=62&fm=webp'
                      f = f'{k}{n}.webp'
                      open(f, 'wb').write(urllib.request.urlopen(urllib.request.Request(raw, headers={'User-Agent': 'Mozilla/5.0'}), timeout=30).read())
                      meta[f] = {'by': ph['user']['name'], 'link': ph['links']['html'], 'alt': ph.get('alt_description')}
                      n += 1
                      if n == 6: break
                  print(k, n)
              except Exception as e:
                  print('ERR', k, e)
          json.dump(meta, open('meta.json', 'w'), indent=1, ensure_ascii=False)
          PY
          python3 get.py | tee /tmp/e/journal.txt
          rm get.py; du -sh .
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
