name: Enquête données 3D 
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - name: Test paiement Lookmiz
        run: |
          set +e
          mkdir -p /tmp/e && cd /tmp/e
          K=sb_publishable_mz--wiLicR1GMDd2b3Fd2g_ewLTbr9h
          curl -s "https://ctgjnpxdaqdnrcxjwnkp.supabase.co/rest/v1/scores?select=*&order=created_at.desc&limit=400" -H "apikey: $K" > scores.json
          python3 - <<'PY' > journal.txt
          import json, collections
          d = json.load(open('scores.json'))
          if isinstance(d, dict): print(d); raise SystemExit
          print('lignes:', len(d)); print('colonnes:', list(d[0].keys()) if d else '')
          by = collections.Counter(str(x.get('created_at', ''))[:10] for x in d)
          for k in sorted(by)[-21:]: print(k, by[k])
          print('joueurs distincts (400 derniers):', len(set(x.get('pseudo') for x in d)))
          q = collections.Counter(str(x.get('quiz', '')).split(':')[0] for x in d); print('quiz:', q.most_common(8))
          for x in d[:10]: print(x.get('created_at'), x.get('pseudo'), x.get('quiz'), x.get('points'))
          PY
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
