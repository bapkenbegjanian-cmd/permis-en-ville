name: Enquête données 3D 
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - name: Photographier le site Cabine en ligne
        run: |
          set +e
          mkdir -p /tmp/e /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null 2>&1; npm i playwright@1.47.2 >/dev/null 2>&1; npx playwright install --with-deps chromium >/dev/null 2>&1
          sleep 100
          cat > t.js <<'JS'
          const { chromium, devices } = require('playwright');
          (async () => {
            const b = await chromium.launch(); const p = await (await b.newContext({ ...devices['iPhone 13'] })).newPage();
            const errs = []; p.on('pageerror', e => errs.push(e.message)); p.on('requestfailed', r => errs.push('KO ' + r.url().slice(0, 90)));
            const r = await p.goto('https://bapkenbegjanian-cmd.github.io/permis-en-ville/cabine/?v=' + Date.now()); console.log('statut', r.status());
            await p.waitForTimeout(3500); await p.screenshot({ path: '/tmp/e/c0.png' });
            await p.click('[data-go="1"]'); await p.waitForTimeout(2500); await p.screenshot({ path: '/tmp/e/c1.png' });
            await p.click('[data-set="g:f"]'); await p.waitForTimeout(1200); await p.screenshot({ path: '/tmp/e/c2.png' });
            await p.click('[data-set="m:X"]'); await p.waitForTimeout(2500); await p.screenshot({ path: '/tmp/e/c3.png', fullPage: true });
            await p.click('[data-set="o:soiree"]'); await p.waitForTimeout(1200); await p.screenshot({ path: '/tmp/e/c4.png' });
            await p.waitForTimeout(3500); await p.screenshot({ path: '/tmp/e/c5.png', fullPage: true });
            await p.click('[data-pick="1"]'); await p.waitForTimeout(2500); await p.screenshot({ path: '/tmp/e/c6.png' });
            console.log('erreurs', errs); await b.close();
          })().catch(e => console.log('ECHEC', e.message));
          JS
          node t.js > /tmp/e/journal.txt 2>&1; cat /tmp/e/journal.txt
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
