name: Enquête données 3D 
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - name: Tester l'essayage sur le site en ligne
        run: |
          set +e
          mkdir -p /tmp/e /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null 2>&1; npm i playwright@1.47.2 >/dev/null 2>&1; npx playwright install --with-deps chromium >/dev/null 2>&1
          curl -sL -o moi.jpg 'https://images.unsplash.com/photo-1715541448446-3369e1cc0ee9?ixid=M3wxMTE2NDI3fDB8MXxzZWFyY2h8NHx8ZmFzaGlvbiUyMG1vZGVsJTIwZnVsbCUyMGJvZHl8ZW58MXwxfHx8MTc5MzIxNDcyNHww&ixlib=rb-4.1.0&w=900&q=85&fm=jpg'
          sleep 90
          cat > t.js <<'JS'
          const { chromium, devices } = require('playwright');
          (async () => {
            const b = await chromium.launch(); const p = await (await b.newContext({ ...devices['iPhone 13'] })).newPage();
            const errs = []; p.on('pageerror', e => errs.push(e.message));
            await p.goto('https://bapkenbegjanian-cmd.github.io/permis-en-ville/cabine/?v=' + Date.now()); await p.waitForTimeout(1500);
            await p.click('[data-go="1"]'); await p.click('[data-set="g:f"]'); await p.click('[data-set="m:X"]'); await p.click('[data-set="o:soiree"]');
            await p.waitForTimeout(3500);
            await p.setInputFiles('#photo', 'moi.jpg'); await p.waitForTimeout(4000);
            await p.locator('.me').screenshot({ path: '/tmp/e/t1.png' });
            await p.waitForSelector('.reveal, [data-try]', { timeout: 120000 }).catch(() => {});
            await p.waitForTimeout(2500);
            await p.screenshot({ path: '/tmp/e/t2.png', fullPage: true });
            console.log('note', await p.textContent('.note').catch(() => '')); console.log('erreurs', errs); await b.close();
          })().catch(e => console.log('ECHEC', e.message));
          JS
          node t.js > /tmp/e/journal.txt 2>&1; cat /tmp/e/journal.txt
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
