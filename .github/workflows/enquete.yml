name: Enquête données 3D 
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - name: Test paiement Lookmiz
        run: |
          set +e
          mkdir -p /tmp/e/assets /tmp/w && cd /tmp/w
          npm i -s @gltf-transform/cli@4.1.1 >/dev/null 2>&1
          cat > dl.py <<'PY'
          import json, os, sys, urllib.request
          def get(u): return urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'lookmiz-asset-fetch'})).read()
          ids = sys.argv[1].split(',')
          for i in ids:
              try:
                  f = json.loads(get('https://api.polyhaven.com/files/' + i))
                  g = f['gltf']['1k']['gltf']; d = 'src/' + i; os.makedirs(d, exist_ok=True)
                  open(d + '/m.gltf', 'wb').write(get(g['url']))
                  for path, inc in g.get('include', {}).items():
                      os.makedirs(os.path.dirname(d + '/' + path), exist_ok=True); open(d + '/' + path, 'wb').write(get(inc['url']))
                  print('ok', i)
              except Exception as e: print('ERR', i, e)
          h = json.loads(get('https://api.polyhaven.com/files/brown_photostudio_02'))['hdri']['1k']['hdr']['url']
          open('/tmp/e/assets/studio.hdr', 'wb').write(get(h)); print('hdr ok')
          PY
          python3 dl.py rubber_duck_toy,treasure_chest,strawberry_chocolate_cake,carrot_cake,brass_candleholders,brass_diya_lantern,Lantern_01,tea_set_01,wooden_candlestick,lambis_shell,Chandelier_02,brass_goblets,pocket_watch,mantel_clock_01,fir_sapling_medium,wine_bottles_01,standing_picture_frame_01,potted_plant_02,wicker_basket_01,horse_statue_01,garden_gnome,ornate_mirror_01,brass_vase_03,food_pomegranate_01,vintage_oil_lamp,brass_pot_01 > /tmp/e/journal.txt 2>&1
          for d in src/*; do n=$(basename $d); npx gltf-transform optimize $d/m.gltf /tmp/e/assets/$n.glb --texture-compress webp --texture-size 512 --compress false >> /tmp/e/journal.txt 2>&1 || echo "ERR opt $n" >> /tmp/e/journal.txt; done
          ls -la /tmp/e/assets >> /tmp/e/journal.txt
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
