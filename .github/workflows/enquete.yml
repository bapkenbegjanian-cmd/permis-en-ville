name: Enquête données 3D
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - name: Lire les fiches officielles
        run: |
          mkdir -p /tmp/e && cd /tmp/e
          UA="permis-en-ville/1.0"
          get() { curl -sSL -m 60 -A "$UA" "$2" -o "$1" -w "$1 %{http_code} %{size_download}\n" >> journal.txt 2>&1 || echo "$1 erreur" >> journal.txt; }
          get datagouv.json "https://www.data.gouv.fr/api/1/datasets/6752312729bbdda4ba8f637f/"
          get geonetwork.json "https://demo.georchestra.org/geonetwork/srv/api/records/a863f530-2dc6-4425-bdf7-0ce11907eadc/formatters/json"
          get grandlyon-search.json "https://data.grandlyon.com/fr/datapusher/ws/grandlyon/all.json?compact=false&maxfeatures=1"
          get gl-catalog.json "https://data.grandlyon.com/api/records/1.0/search/?dataset=photomaillage"
          get gl-geonet.json "https://data.grandlyon.com/geonetwork/srv/api/search/records/_search?q=photomaillage"
          get gl-geonet2.xml "https://data.grandlyon.com/geonetwork/srv/fre/csw?service=CSW&version=2.0.2&request=GetRecords&typeNames=csw:Record&resultType=results&elementSetName=full&constraintLanguage=CQL_TEXT&constraint_language_version=1.1.0&constraint=AnyText%20like%20%27%25photomaillage%25%27"
          get liris-readme.txt "https://dataset-dl.liris.cnrs.fr/three-d-tiles-lyon-metropolis/README.txt"
          get liris-index.html "https://dataset-dl.liris.cnrs.fr/three-d-tiles-lyon-metropolis/2018/Lyon-1_2018_Textured/"
          python3 - <<'PY' >> journal.txt
          import json,re
          try:
              d=json.load(open('datagouv.json')); print('TITRE', d.get('title')); print('LICENCE', d.get('license')); print('DESC', (d.get('description') or '')[:3000])
              for r in d.get('resources',[]): print('RES', r.get('title'), r.get('format'), r.get('url'), r.get('filesize'))
          except Exception as e: print('datagouv parse', e)
          PY
      - name: Enregistrer sur la branche « enquete »
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
