name: Enquête données 3D  
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - name: Verifier la nouvelle fonction Cabine
        run: |
          set +e
          mkdir -p /tmp/e && cd /tmp/e
          K=sb_publishable_mz--wiLicR1GMDd2b3Fd2g_ewLTbr9h
          F=https://ctgjnpxdaqdnrcxjwnkp.supabase.co/functions/v1/bright-endpoint
          { echo "sans compte :"; curl -s -w " [%{http_code}]" -X POST "$F" -H "apikey: $K" -H "Authorization: Bearer $K" -H 'Content-Type: application/json' -d '{"action":"quota"}'; echo
            echo "tables :"; curl -s -w " [%{http_code}]" "https://ctgjnpxdaqdnrcxjwnkp.supabase.co/rest/v1/essais?select=id&limit=1" -H "apikey: $K"; echo; } > journal.txt 2>&1
          cat journal.txt
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
