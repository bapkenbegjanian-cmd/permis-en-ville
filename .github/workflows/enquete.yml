name: Enquête données 3D 
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Photos libres de droit (Pexels)
        run: |
          set +e
          mkdir -p /tmp/e && cd /tmp/e
          for id in 6943426 8037095 6943448 15940893 19285775 14386896 17450454 4677402 6664136 3678384 7594295 17237100 4538421 764883 7667882 8725739 7667738 19651784 11286642; do
            curl -sL -o p$id.jpg "https://images.pexels.com/photos/$id/pexels-photo-$id.jpeg?auto=compress&cs=tinysrgb&w=1000"
            echo "$id $(wc -c < p$id.jpg) $(file -b p$id.jpg | cut -c1-50)" >> journal.txt
          done
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
