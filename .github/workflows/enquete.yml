name: Enquête données 3D 
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - name: Tester l'essayage IA via Supabase
        run: |
          set +e
          mkdir -p /tmp/e && cd /tmp/e
          cat > t.py <<'PY'
          import json, time, urllib.request
          F = 'https://ctgjnpxdaqdnrcxjwnkp.supabase.co/functions/v1/bright-endpoint'
          H = {'Content-Type': 'application/json', 'apikey': 'sb_publishable_mz--wiLicR1GMDd2b3Fd2g_ewLTbr9h'}
          def call(d):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(F, data=json.dumps(d).encode(), headers=H), timeout=60); return r.status, r.read().decode()
              except urllib.error.HTTPError as e: return e.code, e.read().decode()
              except Exception as e: return 0, str(e)
          print('test vide', call({}))
          print('test statut', call({'action': 'status', 'id': 'abc'}))
          M = 'https://images.unsplash.com/photo-1715541448446-3369e1cc0ee9?ixid=M3wxMTE2NDI3fDB8MXxzZWFyY2h8NHx8ZmFzaGlvbiUyMG1vZGVsJTIwZnVsbCUyMGJvZHl8ZW58MXwxfHx8MTc5MzIxNDcyNHww&ixlib=rb-4.1.0&w=768&q=85&fm=jpg'
          G = 'https://images.unsplash.com/photo-1595777457583-95e059d581b8?ixid=M3wxMTE2NDI3fDB8MXxzZWFyY2h8MXx8ZXZlbmluZyUyMGRyZXNzfGVufDF8MXx8fDE3OTMyMTQ3MjJ8MA&ixlib=rb-4.1.0&w=768&q=85&fm=jpg'
          for body in [{'model_name': 'tryon-v1.6', 'inputs': {'model_image': M, 'garment_image': G}}, {'model_image': M, 'garment_image': G, 'category': 'auto'}]:
              c, t = call({'action': 'run', 'body': body}); print('run', c, t[:300])
              try: i = json.loads(t).get('id')
              except Exception: i = None
              if not i: continue
              for k in range(40):
                  time.sleep(3); c, t = call({'action': 'status', 'id': i}); j = json.loads(t)
                  if j.get('status') in ('completed', 'failed'): break
              print('statut', t[:400])
              if j.get('output'):
                  open('resultat.png', 'wb').write(urllib.request.urlopen(j['output'][0]).read())
                  urllib.request.urlretrieve(M, 'modele.jpg'); urllib.request.urlretrieve(G, 'habit.jpg')
              break
          PY
          python3 t.py > journal.txt 2>&1; rm t.py; cat journal.txt
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
