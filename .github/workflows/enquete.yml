name: Enquête données 3D 
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Test paiement Lookmiz
        run: |
          set +e
          mkdir -p /tmp/e && cd /tmp/e
          pip install -q "rembg[cpu]==2.0.59" pillow opencv-python-headless > /dev/null 2>&1
          python3 - > journal.txt 2>&1 <<'PY'
          from rembg import remove, new_session
          from PIL import Image, ImageFilter
          import numpy as np, cv2, os
          src = Image.open(os.environ['GITHUB_WORKSPACE'] + '/maries/src.png').convert('RGB')
          W, H = src.size; big = src.resize((W * 2, H * 2), Image.LANCZOS)
          s = new_session('isnet-general-use')
          cut = remove(big, session=s, post_process_mask=True)
          cut.save('couple.png'); a = np.array(cut)[:, :, 3]
          m = (a > 10).astype(np.uint8) * 255; m = cv2.dilate(m, np.ones((25, 25), np.uint8))
          bg = cv2.inpaint(cv2.cvtColor(np.array(big), cv2.COLOR_RGB2BGR), m, 25, cv2.INPAINT_TELEA)
          cv2.imwrite('fond.jpg', bg, [cv2.IMWRITE_JPEG_QUALITY, 92])
          bb = cut.getbbox(); print('ok', big.size, bb)
          PY
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
