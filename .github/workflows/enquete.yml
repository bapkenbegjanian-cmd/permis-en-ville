name: Enquête données 3D
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml', 'outils/explore_mesh.py']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Branche du photomaillage au-dessus de la rue de la Barre
        run: python3 outils/explore_mesh.py 4.8357 45.7577 /tmp/e 40 || true
      - name: Enregistrer sur la branche « enquete »
        run: |
          cd /tmp/e && du -sh . > taille.txt && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
