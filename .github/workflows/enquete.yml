name: Enquête données 3D 
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Test paiement Lookmiz
        run: |
          set +e
          mkdir -p /tmp/e && cd /tmp/e
          { dig +short staralyn.com A; dig +short www.staralyn.com CNAME; dig +short staralyn.com NS; curl -sI https://www.staralyn.com/fr/ | grep -iE "^(server|x-github|x-vercel|x-nf|cf-ray|x-served|via|location)"; curl -s https://www.staralyn.com/fr/ | grep -oiE "github\.com/[a-z0-9_-]+|pages\.dev|vercel|netlify|generator[^>]*" | sort -u; } > journal.txt 2>&1
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
