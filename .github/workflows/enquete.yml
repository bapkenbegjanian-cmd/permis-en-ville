name: Enquête données 3D
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - name: Noms de domaine libres
        run: |
          set +e
          mkdir -p /tmp/e && cd /tmp/e
          for d in quisait.com quisait.fr quisait.app quisait.io quisait.net quisait.org quisait.games quisait.fun qui-sait.com qui-sait.fr quisait.co quisait.me quisaitquiz.com quisait.eu quizquisait.com; do
            c=$(curl -sS -m 20 -L -o r.json -w "%{http_code}" "https://rdap.org/domain/$d")
            if [ "$c" = "404" ]; then echo "$d LIBRE"; elif [ "$c" = "200" ]; then echo "$d PRIS (exp: $(python3 -c "import json;d=json.load(open('r.json'));print([e['eventDate'][:10] for e in d.get('events',[]) if e.get('eventAction')=='expiration'])"))"; else echo "$d ? ($c)"; fi
          done > journal.txt 2>&1
          cat journal.txt
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
