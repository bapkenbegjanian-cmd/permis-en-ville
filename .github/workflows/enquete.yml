name: Enquête données 3D
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier quizzmatch.com
        run: |
          set +e
          mkdir -p /tmp/e && cd /tmp/e
          { for u in https://www.quizzmatch.com/ http://www.quizzmatch.com/ https://quizzmatch.com/; do
              echo "== $u"; curl -sS -m 30 -o page.html -v -w "HTTP %{http_code} -> %{url_effective}\n" -L "$u"; grep -o "<title>[^<]*" page.html | head -1; done; echo "== DNS www"; dig +short www.quizzmatch.com; } 2>&1 | grep -E "^==|HTTP |title|subject:|issuer:|SSL|error|Location|^[0-9a-z]"  > journal.txt 2>&1
          cat journal.txt
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
