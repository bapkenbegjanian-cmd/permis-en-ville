name: Enquête données 3D 
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Test paiement Lookmiz
        run: |
          set +e
          mkdir -p /tmp/e && cd /tmp/e
          { echo "A:"; dig +short vtcba.com A; echo "www:"; dig +short www.vtcba.com; echo "NS:"; dig +short vtcba.com NS
            for u in http://vtcba.com https://vtcba.com https://www.vtcba.com https://bapkenbegjanian-cmd.github.io/vtcba/; do echo "$u -> $(curl -s -o /tmp/p.html -w '%{http_code} %{redirect_url}' -m 20 $u) $(grep -o '<title>[^<]*' /tmp/p.html | head -1)"; done; } > journal.txt 2>&1
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
