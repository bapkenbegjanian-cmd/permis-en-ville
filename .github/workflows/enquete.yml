name: Enquête données 3D
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier la table du classement
        run: |
          set +e
          mkdir -p /tmp/e && cd /tmp/e
          { echo "== GET scores"; curl -sS -m 30 -w "\nHTTP %{http_code}\n" -H "apikey: sb_publishable_mz--wiLicR1GMDd2b3Fd2g_ewLTbr9h" "https://ctgjnpxdaqdnrcxjwnkp.supabase.co/rest/v1/scores?select=pseudo,quiz,points,created_at&order=created_at.desc&limit=5"; echo; echo "== OPTIONS"; curl -sS -m 30 -o /dev/null -w "HTTP %{http_code}\n" -H "apikey: sb_publishable_mz--wiLicR1GMDd2b3Fd2g_ewLTbr9h" "https://ctgjnpxdaqdnrcxjwnkp.supabase.co/rest/v1/scores?select=count"; } > journal.txt 2>&1
          cat journal.txt
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
