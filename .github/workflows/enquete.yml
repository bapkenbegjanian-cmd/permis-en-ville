name: Enquête données 3D 
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - name: Test paiement Lookmiz
        run: |
          set +e
          mkdir -p /tmp/e && cd /tmp/e
          npm i -s playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
          cat > s.js <<'JS'
          const {chromium,devices}=require('playwright');(async()=>{const b=await chromium.launch();const p=await b.newPage({...devices['Pixel 5'],deviceScaleFactor:1});const L=[];
          await p.goto('https://istudio.am/wedding/artur-yeva',{waitUntil:'networkidle',timeout:60000});await p.waitForTimeout(3000);await p.screenshot({path:'a0.png'});
          await p.mouse.click(196,600);for(let i=1;i<6;i++){await p.waitForTimeout(700);await p.screenshot({path:'a'+i+'.png'});}
          await p.waitForTimeout(3000);await p.screenshot({path:'b.png',fullPage:true});
          L.push(await p.title());L.push((await p.innerText('body')).slice(0,5000));L.push('audio/video/iframe: '+await p.evaluate(()=>[...document.querySelectorAll('audio,video,iframe,canvas')].map(e=>e.tagName+' '+(e.src||'').slice(0,80)).join(' | ')));
          require('fs').writeFileSync('journal.txt',L.join('\n'));await b.close()})()
          JS
          node s.js > err.txt 2>&1; rm -rf node_modules package*.json s.js
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
