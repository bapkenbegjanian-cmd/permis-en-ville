name: Enquête données 3D 
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - name: Chercher des photos mode via l'API officielle Unsplash
        env:
          KEY: ${{ secrets.UNSPLASH_KEY }}
        run: |
          set +e
          mkdir -p /tmp/e && cd /tmp/e
          if [ -z "$KEY" ]; then echo "PAS DE CLE" > journal.txt; exit 0; fi
          cat > get.py <<'PY'
          import json, os, urllib.request, urllib.parse
          Q = {'hero': 'fashion editorial woman', 'soiree': 'evening dress', 'rdv': 'date night outfit', 'travail': 'office outfit',
               'mariage': 'wedding guest dress', 'sport': 'sportswear fashion', 'casual': 'streetwear fashion',
               'homme': 'men suit fashion', 'hommecasual': 'men streetwear', 'studio': 'fashion model full body'}
          out = {}
          for k, q in Q.items():
              u = 'https://api.unsplash.com/search/photos?per_page=10&orientation=portrait&content_filter=high&query=' + urllib.parse.quote(q)
              r = json.load(urllib.request.urlopen(urllib.request.Request(u, headers={'Authorization': 'Client-ID ' + os.environ['KEY'], 'Accept-Version': 'v1'}), timeout=30))
              out[k] = [{'id': p['id'], 'url': p['urls']['regular'], 'raw': p['urls']['raw'], 'alt': p.get('alt_description'), 'color': p.get('color'),
                         'by': p['user']['name'], 'user': p['user']['links']['html'], 'link': p['links']['html']} for p in r['results']]
              print(k, len(out[k]))
          json.dump(out, open('photos.json', 'w'), indent=1, ensure_ascii=False)
          PY
          python3 get.py > journal.txt 2>&1; rm get.py
          cat journal.txt
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
