name: Enquête données 3D  
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - name: Verifier le compteur de visites sur quizzmatch.com
        run: |
          set +e
          mkdir -p /tmp/e && cd /tmp/e
          { curl -s "https://quizzmatch.com/?v=$RANDOM" | grep -o "cloudflareinsights[^>]*" | head -2
            curl -s "https://quizzmatch.com/foot/" | grep -c cloudflareinsights
            curl -s -o /dev/null -w "beacon %{http_code}\n" https://static.cloudflareinsights.com/beacon.min.js
            curl -s "https://www.google.com/search?q=site:quizzmatch.com" -A "Mozilla/5.0" | grep -o "quizzmatch.com[^\"<]*" | sort -u | head -5; } > journal.txt 2>&1
          cat journal.txt
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
