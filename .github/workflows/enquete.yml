name: Enquête données 3D 
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Test paiement Lookmiz
        run: |
          set +e
          mkdir -p /tmp/e/art && cd /tmp/e
          pip install -q "rembg[cpu]==2.0.59" pillow > /dev/null 2>&1
          cat > w.py <<'PY'
          import json, urllib.request, urllib.parse, re
          UA = {'User-Agent': 'LookmizArt/1.0 (github bapkenbegjanian-cmd)'}
          def api(**p):
              p.update(format='json'); return json.loads(urllib.request.urlopen(urllib.request.Request('https://commons.wikimedia.org/w/api.php?' + urllib.parse.urlencode(p), headers=UA), timeout=40).read())
          S = [('dove', 'white dove flying illustration', 8), ('dove', 'Columba livia domestica white Naumann', 4), ('dove', 'dove engraving flying public domain', 6), ('ring', 'gold wedding rings', 6), ('bouquet', 'Redouté bouquet roses', 5)]
          i = 0; log = []
          for tag, q, n in S:
              d = api(action='query', generator='search', gsrsearch=q, gsrnamespace=6, gsrlimit=n, prop='imageinfo', iiprop='url|extmetadata', iiurlwidth=1000)
              for pg in (d.get('query', {}).get('pages', {}) or {}).values():
                  ii = pg['imageinfo'][0]; md = ii.get('extmetadata', {}); lic = md.get('LicenseShortName', {}).get('value', '')
                  if not re.search(r'(public domain|cc0|pd)', lic, re.I) or not re.search(r'\.(jpe?g|png)$', pg['title'], re.I): continue
                  i += 1; fn = f'art/{tag}_{i:02d}.jpg'
                  try: open(fn, 'wb').write(urllib.request.urlopen(urllib.request.Request(ii.get('thumburl') or ii['url'], headers=UA), timeout=60).read()); log.append(f'{fn} | {pg["title"]} | {lic}')
                  except Exception: pass
          open('credits.txt', 'w').write('\n'.join(log))
          PY
          python3 w.py > journal.txt 2>&1
          python3 - >> journal.txt 2>&1 <<'PY'
          from rembg import remove, new_session
          from PIL import Image, ImageDraw
          import glob
          s = new_session('isnet-general-use'); fs = sorted(glob.glob('art/*.jpg'))
          for f in fs:
              try: o = remove(Image.open(f).convert('RGB'), session=s, post_process_mask=True); o = o.crop(o.getbbox()); o.save(f[:-4] + '.png')
              except Exception as e: print('err', f, e)
          ps = sorted(glob.glob('art/*.png')); W = Image.new('RGB', (6 * 220, ((len(ps) + 5) // 6) * 240), (60, 60, 70)); d = ImageDraw.Draw(W)
          for k, f in enumerate(ps):
              im = Image.open(f); im.thumbnail((210, 210)); x, y = (k % 6) * 220 + 5, (k // 6) * 240 + 5; W.paste(im, (x, y), im); d.text((x, y + 215), f[4:], fill=(255, 255, 255))
          W.save('planche.png')
          PY
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
