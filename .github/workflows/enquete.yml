name: Enquête données 3D 
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - name: Test paiement Lookmiz
        run: |
          set +e
          mkdir -p /tmp/e && cd /tmp/e
          npm i -s playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
          cat > s.js <<'JS'
          const {chromium,devices}=require('playwright');(async()=>{const b=await chromium.launch();const p=await b.newPage({...devices['Pixel 5']});const L=[];p.on('pageerror',x=>L.push('ERR '+x.message));
          await new Promise(r=>setTimeout(r,60000));await p.goto('https://lookmiz.com/?v='+Date.now()+'#m-mariage-6',{waitUntil:'networkidle'});await p.waitForTimeout(1500);
          await p.click('[data-ouv=coffret]',{force:true});await p.fill('[data-f=yt]','https://www.youtube.com/watch?v=hT_nvWreIhg');await p.click('[data-preview]',{force:true});await p.waitForTimeout(4000);
          await p.mouse.click(196,420);await p.waitForTimeout(1200);await p.screenshot({path:'a.png'});await p.waitForTimeout(5000);await p.screenshot({path:'b.png'});
          L.push('etat lecteur: '+await p.evaluate(()=>{try{return YTP.getPlayerState()+' t='+YTP.getCurrentTime()}catch(e){return 'x '+e.message}}));L.push('tap: '+await p.evaluate(()=>!!document.querySelector('.music.tap')));
          require('fs').writeFileSync('journal.txt',L.join('\n'));await b.close()})()
          JS
          node s.js > err.txt 2>&1; rm -rf node_modules package*.json s.js
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
