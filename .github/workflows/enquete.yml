name: Enquête données 3D 
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test paiement Lookmiz
        run: |
          set +e
          mkdir -p /tmp/e && cd /tmp/e
          pip install -q "rembg[cpu]==2.0.59" pillow > /dev/null 2>&1
          for f in v1.jpg v2.webp v3.webp; do python3 -c "
          from rembg import remove, new_session
          from PIL import Image
          import sys
          s = new_session('isnet-general-use')
          im = Image.open('$GITHUB_WORKSPACE/voiture/$f').convert('RGB')
          out = remove(im, session=s, post_process_mask=True)
          out = out.crop(out.getbbox()); out.save('${f%.*}.png')
          print('$f', out.size)
          " >> journal.txt 2>&1; done
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
