name: Enquête données 3D  
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - name: Test paiement Lookmiz
        run: |
          set +e
          mkdir -p /tmp/e && cd /tmp/e
          F=https://ctgjnpxdaqdnrcxjwnkp.supabase.co/functions/v1/paiement-
          K=sb_publishable_mz--wiLicR1GMDd2b3Fd2g_ewLTbr9h
          ID=test$(date +%s)ab; CLE=clefdetest$(date +%s)
          { echo "carte:"; curl -s -w " [%{http_code}]" -X POST "https://ctgjnpxdaqdnrcxjwnkp.supabase.co/rest/v1/cartes" -H "apikey: $K" -H 'Content-Type: application/json' -H 'Prefer: return=minimal' -d "{\"id\":\"$ID\",\"cle\":\"$CLE\",\"data\":{\"mid\":\"mariage-1\",\"f\":{\"titre\":\"Test\",\"dest\":[\"A\",\"B\"]}}}"; echo
            echo "lire avant paiement:"; curl -s -X POST "https://ctgjnpxdaqdnrcxjwnkp.supabase.co/rest/v1/rpc/lire_carte" -H "apikey: $K" -H 'Content-Type: application/json' -d "{\"p_id\":\"$ID\"}"; echo
            echo "checkout:"; curl -s -w " [%{http_code}]" -X POST "$F" -H "apikey: $K" -H "Authorization: Bearer $K" -H 'Content-Type: application/json' -d "{\"action\":\"checkout\",\"id\":\"$ID\",\"cle\":\"$CLE\"}" | cut -c1-90; echo; } > journal.txt 2>&1
          cat journal.txt
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
