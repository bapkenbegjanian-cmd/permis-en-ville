name: Enquête données 3D  
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - name: Captures Lookmiz
        timeout-minutes: 8
        run: |
          set +e
          mkdir -p /tmp/e /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null 2>&1; npm i playwright@1.47.2 >/dev/null 2>&1; npx playwright install --with-deps chromium >/dev/null 2>&1
          sleep 70
          cat > t.js <<'JS'
          const { chromium, devices } = require('playwright');
          (async () => { const b = await chromium.launch(); const e = [];
            for (const [n, o] of [['m', devices['iPhone 13']], ['d', { viewport: { width: 1440, height: 900 } }]]) {
              const p = await (await b.newContext(o)).newPage(); p.on('pageerror', x => e.push(x.message));
              const U = 'http://lookmiz.com/?v=' + Date.now();
              await p.goto(U); await p.waitForTimeout(7000); await p.screenshot({ path: `/tmp/e/${n}-home.png`, fullPage: true });
              if (n === 'm') { await p.goto(U + '#m-mariage-2'); await p.waitForTimeout(4000);
                for (const x of ['Camille', 'Thomas et Julie']) { await p.fill('#tagin', x); await p.click('[data-addtag]'); }
                await p.screenshot({ path: '/tmp/e/m-ed.png', fullPage: true }); } }
            console.log('erreurs', e); await b.close(); })();
          JS
          node t.js > /tmp/e/journal.txt 2>&1; cat /tmp/e/journal.txt
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
