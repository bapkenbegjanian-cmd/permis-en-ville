name: Enquête données 3D
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier quizzmatch.com
        run: |
          set +e
          mkdir -p /tmp/e && cd /tmp/e
          K="sb_publishable_mz--wiLicR1GMDd2b3Fd2g_ewLTbr9h"; U="https://ctgjnpxdaqdnrcxjwnkp.supabase.co/rest/v1/scores"
          { echo "== GET in()"; curl -sS -m 30 -w "\nHTTP %{http_code}\n" -H "apikey: $K" "$U?select=pseudo,quiz,points&quiz=in.(%22geo:m%22,%22geo%22)&limit=5"
            echo "== derniers scores"; curl -sS -m 30 -w "\nHTTP %{http_code}\n" -H "apikey: $K" "$U?select=pseudo,quiz,points&order=created_at.desc&limit=5"
            for u in https://quizzmatch.com/ https://quizzmatch.com/banque/basket.js https://quizzmatch.com/en/mangas/ https://quizzmatch.com/sitemap.xml; do echo "== $u"; curl -sS -m 30 -o page -w "HTTP %{http_code} %{size_download} octets\n" "$u"; grep -o "<title>[^<]*" page | head -1; done; } > journal.txt 2>&1
          cat journal.txt
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
