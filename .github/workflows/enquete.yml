name: Enquête données 3D 
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Test paiement Lookmiz
        run: |
          set +e
          mkdir -p /tmp/e && cd /tmp/e
          npm i -s playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
          cat > t.js <<'JS'
          const {chromium,devices}=require('playwright');(async()=>{const b=await chromium.launch();const p=await b.newPage({...devices['iPhone 13']});const L=[];
          p.on('response',r=>{const u=r.url();if(/\.(mp4|webm|mov|m3u8|json|lottie|riv|glb|gltf|mp3|webp|png|jpg)(\?|$)/i.test(u))L.push(r.status()+' '+u.slice(0,160))});
          await p.goto('https://istudio.am/templates/1055',{waitUntil:'networkidle',timeout:60000});await p.waitForTimeout(3000);await p.screenshot({path:'s0.png'});
          L.push('MEDIA: '+await p.evaluate(()=>[...document.querySelectorAll('video,audio,canvas,iframe,img')].slice(0,20).map(e=>e.tagName+' '+(e.currentSrc||e.src||'').slice(0,120)+' '+e.clientWidth+'x'+e.clientHeight).join(' | ')));
          L.push('TEXT: '+(await p.innerText('body')).slice(0,600));
          await p.mouse.click(195,520);for(let i=1;i<=8;i++){await p.waitForTimeout(700);await p.screenshot({path:'s'+i+'.png'});}
          await p.mouse.wheel(0,900);await p.waitForTimeout(1500);await p.screenshot({path:'s9.png'});
          require('fs').writeFileSync('journal.txt',L.join('\n'));await b.close()})()
          JS
          node t.js >> journal.txt 2>&1; rm -rf node_modules package*.json t.js
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
