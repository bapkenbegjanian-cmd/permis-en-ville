name: Enquête données 3D 
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - name: Verifier lookmiz.com
        run: |
          set +e
          mkdir -p /tmp/e && cd /tmp/e
          { dig +short lookmiz.com A; dig +short www.lookmiz.com CNAME
            curl -s -o /dev/null -w "http %{http_code} -> %{redirect_url}\n" http://lookmiz.com/
            curl -s -o p.html -w "https %{http_code}\n" https://lookmiz.com/; grep -o "<title>[^<]*" p.html; } > journal.txt 2>&1
          cat journal.txt
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
