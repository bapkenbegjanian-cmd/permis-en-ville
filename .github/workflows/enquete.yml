name: Enquête données 3D 
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - name: Verifier les noms de domaine libres
        run: |
          set +e
          mkdir -p /tmp/e && cd /tmp/e
          for n in zqxwvkjhgfd7391 google habilly essayz tryzy lookyz outfiz vestimo essayly tryloo stylmi lookami mirly styloo fitzo modyz cabinoo vestyl lookzy trylook; do
            c=$(curl -s -m 15 "https://rdap.verisign.com/com/v1/domain/$n.com" -o r.json -w "%{http_code}"); h=$(head -c 120 r.json | tr -d '\n')
            w=$(whois $n.com 2>/dev/null | grep -ci "no match for")
            echo "$n com=$c nomatch=$w :: $h" >> journal.txt
          done
          cat journal.txt
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
