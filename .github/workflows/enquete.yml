name: Enquête données 3D 
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - name: Test paiement Lookmiz
        run: |
          set +e
          mkdir -p /tmp/e && cd /tmp/e && pip install -q pillow >/dev/null 2>&1
          cat > sk.py <<'PY'
          import json, io, urllib.request, urllib.parse
          from PIL import Image, ImageDraw, ImageFont
          UA = {'User-Agent': 'Mozilla/5.0 lookmiz-preview'}
          def get(u): return urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=30).read()
          Q = [('Mariage', 'wedding ring box'), ('Fleurs', 'rose bloom'), ('Anniversaire', 'birthday cake'), ('Cadeau', 'gift box opening'), ('Enfant', 'cute unicorn'), ('Noel', 'christmas'), ('Lanterne', 'lantern ramadan'), ('Ballons', 'balloons')]
          F = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 22); f2 = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', 15)
          out = Image.new('RGB', (1860, 300 * len(Q)), 'white'); d = ImageDraw.Draw(out); links = []
          for r, (lab, q) in enumerate(Q):
              u = 'https://api.sketchfab.com/v3/search?' + urllib.parse.urlencode({'type': 'models', 'q': q, 'animated': 'true', 'sort_by': '-likeCount', 'count': 12})
              try: res = json.loads(get(u))['results']
              except Exception as e: print('ERR', q, e); continue
              d.text((10, r * 300 + 6), lab, fill='black', font=F); x = 10; n = 0
              for m in res:
                  th = sorted(m['thumbnails']['images'], key=lambda i: abs(i['width'] - 400))[0]['url']
                  try: im = Image.open(io.BytesIO(get(th))).convert('RGB')
                  except Exception: continue
                  im.thumbnail((300, 220)); out.paste(im, (x, r * 300 + 38)); d.text((x, r * 300 + 262), (str(n + 1) + '. ' + m['name'])[:32], fill='black', font=f2)
                  links.append(f"{lab} {n+1} | {m['name']} | {m['viewerUrl']} | vendu={bool(m.get('isPurchasable') or m.get('price'))} | licence={(m.get('license') or {}).get('label') if isinstance(m.get('license'), dict) else m.get('license')}")
                  x += 308; n += 1
                  if n == 6: break
          out.save('sketchfab.png'); open('liens.txt', 'w').write('\n'.join(links))
          PY
          python3 sk.py > journal.txt 2>&1
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
