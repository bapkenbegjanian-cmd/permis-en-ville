name: Enquête données 3D 
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Photos libres de droit
        run: |
          set +e
          mkdir -p /tmp/e && cd /tmp/e
          for p in ecrans:VO_7-kxfFGc ecrans2:R7aBdi5OHtA porno:SUJu6bTIBhE porno2:1mFg9zzIvT8 jeux:MJX7-BAdkt0 tabac:OYUmxJYbHqg tabac2:yOTfmRaA_cQ cannabis:dnBxrPdD8kU cannabis2:qcCPIhhdgTw soiree:8RpxoTmvTRA soiree2:bkO7PBIx6Eo; do
            n=${p%%:*}; id=${p##*:}
            curl -sL -A "Mozilla/5.0" -o $n.jpg "https://unsplash.com/photos/$id/download?force=true&w=1100"
            echo "$n $id $(wc -c < $n.jpg) $(file -b $n.jpg | cut -c1-60)" >> journal.txt
          done
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
