name: Enquête données 3D  
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - name: Compter les parties QuizzMatch
        run: |
          set +e
          mkdir -p /tmp/e && cd /tmp/e
          K=sb_publishable_mz--wiLicR1GMDd2b3Fd2g_ewLTbr9h
          curl -s 'https://ctgjnpxdaqdnrcxjwnkp.supabase.co/rest/v1/scores?select=pseudo,quiz,points,created_at&order=created_at.desc&limit=1000' -H "apikey: $K" > /tmp/scores.json
          cat > /tmp/c.py <<'PY'
          import json, collections
          d = json.load(open('/tmp/scores.json')); print('total', len(d))
          days = collections.Counter(x['created_at'][:10] for x in d)
          for k in sorted(days)[-10:]: print(k, days[k])
          print('joueurs', len(set(x['pseudo'] for x in d)))
          for x in d[:15]: print(x['created_at'][:16], x['pseudo'], x['quiz'], x['points'])
          PY
          python3 /tmp/c.py > journal.txt 2>&1; cat journal.txt
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
