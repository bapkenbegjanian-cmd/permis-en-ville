name: Enquête données 3D 
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - name: Verifier la video sur Cabine
        run: |
          set +e
          mkdir -p /tmp/e /tmp/pw && cd /tmp/pw
          { curl -s "https://bapkenbegjanian-cmd.github.io/permis-en-ville/cabine/?v=$RANDOM" | grep -o 'demo.mp4[^>]*' | head -1
            curl -s -o /dev/null -w "mp4 %{http_code} %{content_type} %{size_download}\n" https://bapkenbegjanian-cmd.github.io/permis-en-ville/cabine/demo.mp4; } > /tmp/e/journal.txt
          npm init -y >/dev/null 2>&1; npm i playwright@1.47.2 >/dev/null 2>&1; npx playwright install --with-deps webkit >/dev/null 2>&1
          cat > t.js <<'JS'
          const { webkit, devices } = require('playwright');
          (async () => { const b = await webkit.launch(); const p = await (await b.newContext({ ...devices['iPhone 13'] })).newPage();
            await p.goto('https://bapkenbegjanian-cmd.github.io/permis-en-ville/cabine/?v=' + Date.now()); await p.waitForTimeout(6000);
            const v = await p.evaluate(() => { const x = document.querySelector('.demo video'); return x ? { ready: x.readyState, paused: x.paused, t: x.currentTime, err: x.error && x.error.code } : null; });
            console.log('video', JSON.stringify(v)); await p.locator('.demo').screenshot({ path: '/tmp/e/vid.png' }).catch(e => console.log(e.message)); await b.close(); })();
          JS
          node t.js >> /tmp/e/journal.txt 2>&1; cat /tmp/e/journal.txt
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
