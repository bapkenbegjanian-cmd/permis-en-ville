name: Enquête données 3D 
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enquete.yml']
permissions:
  contents: write
jobs:
  enquete:
    runs-on: ubuntu-latest
    steps:
      - name: Test paiement Lookmiz
        run: |
          set +e
          mkdir -p /tmp/e && cd /tmp/e
          K=sb_publishable_mz--wiLicR1GMDd2b3Fd2g_ewLTbr9h
          for o in 0 1000 2000 3000; do curl -s "https://ctgjnpxdaqdnrcxjwnkp.supabase.co/rest/v1/scores?select=pseudo,quiz,points,created_at&order=created_at.asc&limit=1000&offset=$o" -H "apikey: $K" > s$o.json; done
          python3 - <<'PY' > journal.txt
          import json
          faux = set("Adam,Amine,Anais,Bilel,Camille,ChloeB,Clara,Dylan,Emma,Enzo,Hugo,Ilyes,Ines,Jade,Jules,Kenzo,Kevin_L,Lea.M,Leo,Lina_92,Louna,Lucas,Manon,Maxime,Mehdi.R,Moon,Nassim,Nina,Noah,Nora,QuizKing,Rayan,Samy,Sarah,Sofia,Theo,Tom06,Yanis,Yasmine,Zizou10".split(','))
          d = []
          for o in (0, 1000, 2000, 3000):
              x = json.load(open(f's{o}.json'))
              if isinstance(x, list): d += x
          print('scores au total:', len(d))
          vrais = [x for x in d if x['pseudo'] not in faux]
          print('scores avec un nom qui n est PAS dans mes faux:', len(vrais))
          for x in vrais: print(x['created_at'][:16], '|', x['pseudo'], '|', x['quiz'], '|', x['points'])
          PY
      - name: Enregistrer sur la branche « enquete »
        if: always()
        run: |
          cd /tmp/e && git init -q -b enquete && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add . && git commit -qm enquete && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enquete
